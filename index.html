<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Control Horario</title>
<meta name="description" content="Control horario y fichaje de trabajo personal, 100% local.">
<meta name="theme-color" content="#910048">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fichaje">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23910048'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='white' stroke-width='7'/%3E%3Cline x1='50' y1='50' x2='50' y2='30' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='65' y2='58' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23910048'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='white' stroke-width='7'/%3E%3Cline x1='50' y1='50' x2='50' y2='30' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='65' y2='58' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f3fb; --surface:#ffffff; --surface-2:#f7f5fc; --text:#1a1523; --muted:#6b6478;
  --border:#e6e1f2; --primary:#910048; --primary-dark:#5c002e; --primary-contrast:#ffffff;
  --accent-blue:#2563eb;
  --success:#16a34a; --warning:#ea580c; --extra:#ea580c; --descanso:var(--accent-blue); --comida:#0d9488;
  --viaje:#0891b2; --reunion:#7c3aed; --danger:#dc2626; --danger-dark:#b91c1c; --shadow:0 1px 3px rgba(90,0,45,.08),0 1px 2px rgba(90,0,45,.06);
  --shadow-lg:0 10px 30px rgba(90,0,45,.18); --radius:16px; --radius-sm:10px;
  --festivo:#e11d48; --compensacion:#4f46e5;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#14101f; --surface:#1d1830; --surface-2:#251f3b; --text:#f2eefb; --muted:#a79cc2;
  --border:#3a3255; --primary:#c81368; --primary-dark:#910048; --primary-contrast:#ffffff;
  --accent-blue:#60a5fa;
  --success:#22c55e; --warning:#fb923c; --extra:#fb923c; --descanso:var(--accent-blue); --comida:#2dd4bf;
  --viaje:#22d3ee; --reunion:#a78bfa; --danger:#f87171; --danger-dark:#ef4444; --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  --festivo:#fb7185; --compensacion:#818cf8;
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
#app{max-width:560px;margin:0 auto;padding:16px 16px 24px;position:relative;}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}
.hidden{display:none !important;}

/* Header */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px;}
.app-header .brand{display:flex;align-items:center;gap:10px;}
.app-header .brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent-blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}
.app-header h1{font-size:17px;font-weight:700;}
.header-date{font-size:12px;color:var(--muted);}

/* Tabs container */
.tab-panel{display:none;animation:fade .18s ease;}
.tab-panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--border);}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:12px;}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.card-row:last-child{border-bottom:none;}
.card-row .label{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;}
.card-row .value{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}

/* Status hero */
.hero{background:linear-gradient(160deg,var(--primary),var(--primary-dark));color:#fff;border-radius:20px;padding:22px 20px;box-shadow:var(--shadow-lg);margin-bottom:14px;position:relative;overflow:hidden;}
.hero.estado-descanso{background:linear-gradient(160deg,var(--descanso),#1d4ed8);}
.hero.estado-comida{background:linear-gradient(160deg,var(--comida),#0f766e);}
.hero.estado-fuera{background:linear-gradient(160deg,#64748b,#475569);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.badge-estado{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.02em;}
.badge-estado .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.hero-fecha{font-size:12.5px;opacity:.85;}
.hero-timer{font-size:44px;font-weight:800;letter-spacing:.01em;font-variant-numeric:tabular-nums;line-height:1;margin:4px 0 2px;}
.hero-timer-label{font-size:12.5px;opacity:.85;margin-bottom:14px;}
.hero-extra{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;margin-top:6px;}
.hero-extra strong{font-size:20px;font-variant-numeric:tabular-nums;}
.hero-extra span{font-size:11.5px;opacity:.85;display:block;}
.hero-sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.hero-sub .item{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;}
.hero-sub .item b{display:block;font-size:17px;font-variant-numeric:tabular-nums;}
.hero-sub .item small{font-size:11px;opacity:.85;}

/* Progress bar */
.progress-wrap{margin-top:16px;}
.progress-track{background:rgba(255,255,255,.22);border-radius:999px;height:12px;overflow:hidden;}
.progress-fill{height:100%;background:#fff;border-radius:999px;transition:width .4s ease;}
.progress-fill.extra{background:var(--extra);}
.progress-text{font-size:11.5px;margin-top:6px;opacity:.9;display:flex;justify-content:space-between;}

/* Buttons */
.btn{border:none;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s ease, filter .15s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-outline{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-soft{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-descanso{background:var(--descanso);color:#fff;}
.btn-comida{background:var(--comida);color:#fff;}
.btn-viaje{background:var(--viaje);color:#fff;}
.btn-reunion{background:var(--reunion);color:#fff;}
.btn-lg{padding:20px;font-size:18px;border-radius:18px;}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px;width:auto;font-weight:600;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-row.single{grid-template-columns:1fr;}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--text);}
.icon-btn:disabled{opacity:.35;cursor:not-allowed;}

/* Banner aviso */
.banner{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
[data-theme="dark"] .banner{background:#3a2f10;border-color:#7c5e12;color:#fde68a;}
.banner b{display:block;margin-bottom:8px;font-size:14.5px;}
.banner .btn-row{margin-top:10px;}

/* Nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;
  max-width:560px;margin:0 auto;}
.tabbar-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:10px;cursor:pointer;}
.tabbar-item .ic{font-size:20px;line-height:1;}
.tabbar-item.active{color:var(--primary);}

/* Forms */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=time],.field input[type=date],
.field input[type=datetime-local],.field input[type=month],.field input[type=password],.field select,.field textarea{
  width:100%;padding:12px 13px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface-2);
  color:var(--text);font-size:15px;font-family:inherit;
}
.field textarea{resize:vertical;min-height:64px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.switch-row:last-child{border-bottom:none;}
.switch-row .txt b{display:block;font-size:14px;}
.switch-row .txt small{color:var(--muted);font-size:12px;}
.switch{position:relative;width:46px;height:27px;background:var(--border);border-radius:999px;border:none;cursor:pointer;flex:none;}
.switch.on{background:var(--primary);}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;background:#fff;border-radius:50%;transition:left .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{left:22px;}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;border:none;background:none;padding:9px 6px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;}
.seg button.active{background:var(--primary);color:#fff;}

/* Day rows for dia-config */
.dia-row{display:grid;grid-template-columns:24px 1fr 56px 18px 32px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.dia-row:last-child{border-bottom:none;}
.dia-row .dname{font-size:13px;font-weight:700;}
.dia-row .dunit{font-size:11.5px;color:var(--muted);}
.dia-row input[type=time]{padding:8px;font-size:13px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);width:100%;}
.dia-row input[type=number]{padding:8px;font-size:13px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);width:100%;}
.dia-row input[type=number]:disabled{opacity:.45;}
.dia-comida-btn{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.4;}
.dia-comida-btn.on{opacity:1;border-color:var(--comida);background:rgba(13,148,136,.12);}
.dia-comida-btn:disabled{cursor:not-allowed;opacity:.25;}

/* History list */
.hist-filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.hist-filters-secondary{margin-top:-6px;}
.chip{flex:none;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.search-box{margin-bottom:12px;}
.day-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);}
.day-item:active{transform:scale(.99);}
.day-item.es-viaje{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);}
[data-theme="dark"] .day-item.es-viaje{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);}
.day-item .di-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;row-gap:6px;column-gap:8px;}
.day-item .di-pills{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;margin-left:auto;}
.day-item .di-date{font-weight:700;font-size:14.5px;text-transform:capitalize;}
.day-item .di-date small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;text-transform:none;}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;flex:none;}
.day-item .di-pills:has(.pill ~ .pill) .pill{font-size:9.5px;padding:2px 7px;}
.pill.extra{background:#ffedd5;color:#9a3412;}
[data-theme="dark"] .pill.extra{background:#4a2a0f;color:#fdba74;}
.pill.open{background:#dbeafe;color:#1e40af;}
[data-theme="dark"] .pill.open{background:#1e3a5f;color:#93c5fd;}
.di-stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);}
.di-stats b{color:var(--text);font-variant-numeric:tabular-nums;}
.empty-state{text-align:center;padding:40px 12px;color:var(--muted);}
.empty-state .ic{font-size:38px;margin-bottom:10px;}

.pill.viaje{background:#cffafe;color:#155e75;}
[data-theme="dark"] .pill.viaje{background:#0e3a44;color:#67e8f9;}
.pill.reunion{background:#ede9fe;color:#5b21b6;}
[data-theme="dark"] .pill.reunion{background:#2e1f4d;color:#c4b5fd;}
.pill.sincomida{background:#fce7e7;color:#9f1239;}
[data-theme="dark"] .pill.sincomida{background:#3f1620;color:#fda4af;}

.informe-meses-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.mes-card{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;font-size:13.5px;}
.mes-card input{flex:none;}
.mes-card-nombre{font-weight:600;}
.mes-card-badge{width:100%;font-size:11px;color:var(--success);}
.mes-card:has(input:checked){border-color:var(--primary);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,17,21,.55);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-overlay.center{align-items:center;padding:16px;}
.modal-box{background:var(--surface);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-overlay.center .modal-box{border-radius:20px;max-height:85vh;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h3{font-size:17px;font-weight:800;}
.modal-close{background:var(--surface-2);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text);}
.mini-list-item{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:9px;}
.mini-list-item .mli-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;margin-bottom:6px;}
.mli-actions{display:flex;gap:6px;margin-top:8px;}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 10px;}
.section-title:first-child{margin-top:0;}

/* Toast */
#toastRoot{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:520px;align-items:center;}
.toast{background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .2s ease;text-align:center;max-width:100%;}
[data-theme="dark"] .toast{background:#2c3140;}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-dow{text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;padding-bottom:4px;}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:9px;font-size:12px;background:var(--surface-2);color:var(--text);border:1px solid transparent;cursor:pointer;position:relative;}
.cal-day.empty{background:none;cursor:default;}
.cal-day.worked{background:#ede9fe;color:#5b21b6;font-weight:700;}
[data-theme="dark"] .cal-day.worked{background:#3a2a63;color:#ddd6fe;}
.cal-day.has-extra{background:#fed7aa;color:#7c2d12;}
[data-theme="dark"] .cal-day.has-extra{background:#5a3410;color:#fdba74;}
.cal-day.weekend{background:var(--surface);color:var(--muted);}
.cal-day.festivo{background:rgba(225,29,72,.16);color:var(--festivo);font-weight:700;}
.cal-day.vacaciones{background:rgba(22,163,74,.16);color:var(--success);font-weight:700;}
.cal-day.compensacion{background:rgba(79,70,229,.16);color:var(--compensacion);font-weight:700;}
.cal-day.today{outline:2px solid var(--accent-blue);outline-offset:1px;}
.cal-day .dot{width:4px;height:4px;border-radius:50%;background:currentColor;margin-top:2px;}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:12px;}
.cal-legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.cal-legend .sw{width:11px;height:11px;border-radius:4px;flex:none;}

.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.summary-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;}
.summary-tile b{display:block;font-size:19px;font-variant-numeric:tabular-nums;}
.summary-tile small{color:var(--muted);font-size:11.5px;}

footer.appfoot{text-align:center;color:var(--muted);font-size:11px;padding:22px 8px 4px;line-height:1.6;}
a.link{color:var(--primary);text-decoration:none;font-weight:600;}
.gap8{height:8px;}

/* Auth screen */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow-lg);}
.auth-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--accent-blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;}
.auth-card h2{font-size:19px;font-weight:800;text-align:center;margin-bottom:4px;}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px;}
.auth-card .field{margin-bottom:12px;}
.auth-error{background:#fee2e2;color:#991b1b;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
[data-theme="dark"] .auth-error{background:#3f1d1d;color:#fca5a5;}
.role-pick{display:flex;gap:10px;margin-bottom:16px;}
.role-opt{flex:1;border:1.5px solid var(--border);background:var(--surface-2);border-radius:12px;padding:14px 10px;text-align:center;cursor:pointer;}
.role-opt.active{border-color:var(--primary);background:rgba(124,58,237,.08);}
.role-opt .ic{font-size:22px;display:block;margin-bottom:6px;}
.role-opt b{display:block;font-size:13px;}
.role-opt small{color:var(--muted);font-size:11px;}
.auth-switch{text-align:center;margin-top:14px;font-size:12.5px;color:var(--muted);}

/* Equipo (directivo) */
.worker-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.worker-card .wc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.worker-card .wc-name{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:8px;}
.worker-card .wc-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent-blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}

<script>
'use strict';
/* =========================================================================
   CONTROL HORARIO — aplicación autocontenida (HTML + CSS + JS)
   Todos los datos se guardan en localStorage. No requiere servidor.
   ========================================================================= */

/* ----------------------------- Utilidades ----------------------------- */
const STORAGE_KEY = 'controlHorario_data_v1';
const DOW_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DOW_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function pad2(n){ return String(Math.trunc(n)).padStart(2,'0'); }
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);
}
function todayStr(d = new Date()){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseDateLocal(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(dateStr, n){ const d = parseDateLocal(dateStr); d.setDate(d.getDate()+n); return todayStr(d); }
function toDatetimeLocalValue(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
function fromDatetimeLocalValue(v){ const t = new Date(v).getTime(); return isNaN(t) ? null : t; }
// Combina una fecha "YYYY-MM-DD" con una hora "HH:MM" (de un <input type=time>)
// en un timestamp de ese mismo día. Devuelve null si la hora no es válida.
function timeStrEnFecha(fechaStr, horaStr){
  const m = String(horaStr || '').match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return null;
  const d = parseDateLocal(fechaStr);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate(), Number(m[1]), Number(m[2])).getTime();
}
function fmtTimeHM(ts){ if(ts==null) return '--:--'; const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtDateHuman(s){
  const d = parseDateLocal(s);
  return `${DOW_NAMES[d.getDay()]} ${d.getDate()} de ${MONTH_NAMES[d.getMonth()]}`;
}
function fmtDateShort(s){
  const d = parseDateLocal(s);
  return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
}
// Duración en HH:MM (redondeo al minuto, sin negativos)
function fmtHM(ms){
  ms = Math.max(0, ms || 0);
  const totalMin = Math.round(ms/60000);
  return `${pad2(Math.floor(totalMin/60))}:${pad2(totalMin%60)}`;
}
// Duración en HH:MM:SS para contadores en vivo
function fmtHMS(ms){
  ms = Math.max(0, ms || 0);
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
}
function hoursDecimal(ms){ return Math.round((ms/3600000)*100)/100; }
// Igual que fmtHM pero conservando el signo (para saldos que pueden ser negativos)
function fmtHMSigned(ms){ return (ms < 0 ? '-' : '') + fmtHM(Math.abs(ms || 0)); }
// Interpreta un texto "HH:MM" (con signo opcional) devuelto por fmtHM/fmtHMSigned
// al releer un informe mensual ya exportado. Devuelve 0 si no tiene ese formato.
function parseHMTexto(texto){
  const m = String(texto ?? '').trim().match(/^(-)?(\d+):(\d{2})$/);
  if(!m) return 0;
  const signo = m[1] ? -1 : 1;
  return signo * ((Number(m[2]) * 60 + Number(m[3])) * 60000);
}

const COLUMNAS_EXPORT = [
  {id:'trabajador',  label:'Trabajador'},
  {id:'fecha',       label:'Fecha'},
  {id:'diaSemana',   label:'Día de la semana'},
  {id:'horaEntrada', label:'Hora entrada'},
  {id:'horaSalida',  label:'Hora salida'},
  {id:'tiempoBruto', label:'Tiempo bruto (h)'},
  {id:'descansos',   label:'Descansos (h)'},
  {id:'comida',      label:'Comida (h)'},
  {id:'horasEfectivas', label:'Horas efectivas'},
  {id:'horasNormales',  label:'Horas normales'},
  {id:'horasExtra',     label:'Horas extra'},
  {id:'diaViaje',    label:'Horas extra imputables'},
  {id:'tipoViaje',   label:'Tipo (viaje/reunión)'},
  {id:'lugarViaje',  label:'Lugar del viaje'},
  {id:'clienteViaje', label:'Cliente'},
  {id:'observaciones', label:'Observaciones'}
];
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clamp(n, lo, hi){ return Math.min(hi, Math.max(lo, n)); }

/* ----------------------------- Modelo de datos -------------------------- */
function defaultConfig(){
  return {
    horasNormales: 8,
    descansoMin: 15,
    comidaMin: 45,
    comidaInicio: '14:30',
    comidaFin: '15:30',
    modoDescanso: 'manual',   // 'auto' | 'manual'
    modoComida: 'horario',    // 'auto' (duración fija) | 'manual' | 'horario' (franja fija)
    tema: 'auto',             // 'claro' | 'oscuro' | 'auto'
    avisoEntradaActivo: true,
    avisoEntradaHora: '08:30',
    exportColumnas: COLUMNAS_EXPORT.map(c => c.id),
    // La jornada normal de cada día se cuenta a partir de la hora real de
    // fichaje de entrada (no de un horario fijo de entrada/salida).
    dias: {
      1: {activo:true,  horas:8.5, comida:true},
      2: {activo:true,  horas:8.5, comida:true},
      3: {activo:true,  horas:8.5, comida:true},
      4: {activo:true,  horas:8.5, comida:true},
      5: {activo:true,  horas:6,   comida:true},
      6: {activo:false, horas:0,   comida:true},
      0: {activo:false, horas:0,   comida:true}
    }
  };
}
function defaultData(){
  return {
    version: 1, config: defaultConfig(), jornadas: [],
    perfil: null,          // {nombre, passHash, rol:'trabajador'|'directivo'}
    sesionAbierta: false,  // se mantiene iniciada entre aperturas, como cualquier app del móvil
    equipo: [],            // solo lo usa el rol "directivo": informes importados de trabajadores
    calendarioLaboral: {}, // { 'YYYY-MM-DD': {tipo:'festivo'|'vacaciones'|'compensacion', nombre?, horas?} }
    viajes: {},            // { 'YYYY-MM-DD': {activo:true, lugar, cliente} } — días de viaje/instalación
    sinComida: {},         // { 'YYYY-MM-DD': true } — días en los que se avisó "no he comido"
    comidaOverride: {},    // { 'YYYY-MM-DD': {inicio:'HH:MM', fin:'HH:MM'} } — hora de comida modificada solo ese día
    informesDescargados: {} // { 'YYYY-MM': {fecha, incompleto} } — informes mensuales ya descargados
  };
}

let DATA = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const parsed = JSON.parse(raw);
    // Fusión defensiva por si faltan campos (versiones futuras / datos parciales)
    const def = defaultData();
    const cfg = Object.assign({}, def.config, parsed.config || {});
    const diasGuardados = (parsed.config && parsed.config.dias) || {};
    cfg.dias = {};
    for(const dow of Object.keys(def.config.dias)){
      cfg.dias[dow] = Object.assign({}, def.config.dias[dow], diasGuardados[dow] || {});
    }
    const idsValidos = COLUMNAS_EXPORT.map(c => c.id);
    const columnasGuardadas = Array.isArray(cfg.exportColumnas) ? cfg.exportColumnas.filter(id => idsValidos.includes(id)) : [];
    cfg.exportColumnas = columnasGuardadas.length ? columnasGuardadas : idsValidos;
    return {
      version: 1,
      config: cfg,
      jornadas: Array.isArray(parsed.jornadas) ? parsed.jornadas : [],
      perfil: parsed.perfil || null,
      sesionAbierta: !!parsed.sesionAbierta,
      equipo: Array.isArray(parsed.equipo) ? parsed.equipo : [],
      calendarioLaboral: (parsed.calendarioLaboral && typeof parsed.calendarioLaboral === 'object') ? parsed.calendarioLaboral : {},
      viajes: (parsed.viajes && typeof parsed.viajes === 'object') ? parsed.viajes : {},
      sinComida: (parsed.sinComida && typeof parsed.sinComida === 'object') ? parsed.sinComida : {},
      comidaOverride: (parsed.comidaOverride && typeof parsed.comidaOverride === 'object') ? parsed.comidaOverride : {},
      informesDescargados: (parsed.informesDescargados && typeof parsed.informesDescargados === 'object') ? parsed.informesDescargados : {}
    };
  }catch(e){
    console.error('Error cargando datos, se usará configuración por defecto.', e);
    return defaultData();
  }
}
function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
}
function save(){ persist(); }

/*
 * ---------------------------------------------------------------------
 * Identificación de usuario (perfil trabajador / directivo)
 * ---------------------------------------------------------------------
 * Importante: esto es una app 100% local, sin servidor. La contraseña
 * solo sirve para identificar quién usa el dispositivo y evitar que
 * alguien cambie el perfil o los datos por error — NO es un sistema de
 * seguridad real (quien tenga acceso físico al dispositivo y sepa
 * inspeccionar el código podría llegar a los datos). Aun así, la
 * contraseña se guarda como huella SHA-256, nunca en texto plano.
 */
async function hashPassword(pass){
  try{
    const bytes = new TextEncoder().encode(pass);
    const buf = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // Fallback muy simple si SubtleCrypto no está disponible (navegadores muy antiguos).
    let h = 0;
    for(let i=0;i<pass.length;i++){ h = ((h<<5)-h+pass.charCodeAt(i))|0; }
    return 'fallback-' + h;
  }
}
function sesionActiva(){ return !!(DATA.perfil && DATA.sesionAbierta); }
function esDirectivo(){ return !!(DATA.perfil && DATA.perfil.rol === 'directivo'); }

/* ----------------------------- Estado UI -------------------------------- */
const UI = {
  tab: 'hoy',
  historico: { filtro: 'mes', rangoIni: todayStr(), rangoFin: todayStr(), busqueda: '', soloViaje: false },
  resumen: { periodo: 'semana', mesRef: todayStr(), semanaRef: todayStr(), mesResumenRef: todayStr() },
  bannerDismissed: false,
  avisoDescartadoFecha: null,
  informeMensual: null // { anio, seleccionados: Set<clave> } — estado del modal "Informe mensual", se resetea cada vez que se abre
};

/* ----------------------------- Consultas de datos ------------------------ */
function jornadaAbierta(){ return DATA.jornadas.find(j => j.salida == null) || null; }
function descansoAbierto(j){ return j ? j.descansos.find(d => d.fin == null) || null : null; }
function comidaAbierta(j){ return j ? j.comidas.find(c => c.fin == null) || null : null; }
function getJornada(id){ return DATA.jornadas.find(j => j.id === id) || null; }
// Un mismo día puede tener varios tramos fichados (p.ej. se ficha entrada y
// salida dos veces): se devuelven TODOS, ordenados por hora de entrada.
function jornadasDeFecha(fecha){ return DATA.jornadas.filter(j => j.fecha === fecha).sort((a,b) => a.entrada - b.entrada); }

/* ----------------------------- Días de viaje / sin comida ----------------- */
// tipo: 'viaje' (con lugar) o 'reunion' (sin lugar) — ambos imputan las horas
// extra del día. Las marcas antiguas no tenían "tipo": se tratan como 'viaje'.
function obtenerViaje(fechaStr){
  const v = DATA.viajes[fechaStr];
  if(!v) return null;
  return Object.assign({}, v, { tipo: v.tipo === 'reunion' ? 'reunion' : 'viaje' });
}
function diaEsViaje(fechaStr){ return !!(DATA.viajes[fechaStr] && DATA.viajes[fechaStr].activo); }
function marcarViaje(fechaStr, tipo, lugar, cliente){
  const t = tipo === 'reunion' ? 'reunion' : 'viaje';
  DATA.viajes[fechaStr] = { activo:true, tipo:t, lugar: t==='viaje' ? (lugar||'').trim() : '', cliente:(cliente||'').trim() };
  save();
}
function quitarViaje(fechaStr){ delete DATA.viajes[fechaStr]; save(); }
function diaSinComida(fechaStr){ return !!DATA.sinComida[fechaStr]; }
function marcarSinComida(fechaStr){ DATA.sinComida[fechaStr] = true; save(); }
function quitarSinComida(fechaStr){ delete DATA.sinComida[fechaStr]; save(); }

// Hora de comida modificada solo para un día concreto (modo "horario"): no
// toca la franja fija configurada en Ajustes, solo la sustituye ese día.
function comidaOverrideDeFecha(fechaStr){ return DATA.comidaOverride[fechaStr] || null; }
function marcarComidaOverride(fechaStr, inicio, fin){ DATA.comidaOverride[fechaStr] = { inicio, fin }; save(); }
function quitarComidaOverride(fechaStr){ delete DATA.comidaOverride[fechaStr]; save(); }
// Texto "HH:MM–HH:MM" del horario de comida que aplica realmente ese día
// (el override de ese día si existe, si no el habitual de Ajustes).
function comidaHorarioTextoFecha(fechaStr){
  const o = comidaOverrideDeFecha(fechaStr);
  return `${o?.inicio || DATA.config.comidaInicio}–${o?.fin || DATA.config.comidaFin}`;
}

function sumIntervals(list, now){
  let total = 0;
  for(const it of list){
    const fin = it.fin == null ? now : it.fin;
    total += Math.max(0, fin - it.inicio);
  }
  return total;
}

function diaConfigFor(fechaStr){
  const dow = parseDateLocal(fechaStr).getDay();
  return DATA.config.dias[dow] || null;
}
function jornadaNormalMsForFecha(fechaStr){
  const dia = diaConfigFor(fechaStr);
  if(dia && dia.activo === false) return 0;
  const horas = (dia && dia.horas !== '' && dia.horas != null) ? Number(dia.horas) : Number(DATA.config.horasNormales);
  return Math.round((horas || 0) * 3600000);
}

// Horas fijas de compensación por día de la semana. A diferencia de la
// jornada configurable en Ajustes, estas NO cambian aunque se edite el
// horario habitual: de lunes a jueves un día de compensación siempre
// descuenta 8,5 h del banco de horas, y el viernes siempre 6 h.
const HORAS_COMPENSACION_FIJAS = {1:8.5, 2:8.5, 3:8.5, 4:8.5, 5:6, 6:0, 0:0};
function horasCompensacionFijasFor(fechaStr){
  const dow = parseDateLocal(fechaStr).getDay();
  return HORAS_COMPENSACION_FIJAS[dow] ?? 0;
}

/* ----------------------------- Calendario laboral (festivos / vacaciones / banco de horas) ---- */
function diaCalendarioLaboral(fechaStr){ return DATA.calendarioLaboral[fechaStr] || null; }
function marcarDiaCalendarioLaboral(fechaStr, tipo, nombre){
  if(tipo === 'compensacion'){
    DATA.calendarioLaboral[fechaStr] = { tipo, horas: horasCompensacionFijasFor(fechaStr) };
  } else if(tipo === 'festivo'){
    DATA.calendarioLaboral[fechaStr] = { tipo, nombre: (nombre || '').trim() || 'Festivo' };
  } else {
    DATA.calendarioLaboral[fechaStr] = { tipo: 'vacaciones' };
  }
  save();
}
function quitarMarcaCalendarioLaboral(fechaStr){
  delete DATA.calendarioLaboral[fechaStr];
  save();
}
// El parámetro opcional "hastaFecha" (YYYY-MM-DD, inclusive) permite calcular
// el saldo del banco de horas en un momento concreto del pasado (p.ej. para
// el informe mensual: saldo a inicio/fin de un mes), en vez de solo "a hoy".
function bancoHorasGeneradoMs(hastaFecha){
  let total = 0;
  // Se recorre por DÍA (no por tramo/jornada) para que el límite de la
  // jornada normal se aplique una sola vez sobre el total del día, incluso si
  // ese día se fichó entrada/salida varias veces (ver calcDia).
  const fechas = new Set(DATA.jornadas.map(j => j.fecha));
  fechas.forEach(fecha => {
    if(hastaFecha && fecha > hastaFecha) return;
    total += calcDia(fecha, Date.now()).extra;
  });
  return total;
}
function bancoHorasCompensadoMs(hastaFecha){
  let total = 0;
  Object.entries(DATA.calendarioLaboral).forEach(([fecha, e]) => {
    if(e.tipo !== 'compensacion') return;
    if(hastaFecha && fecha > hastaFecha) return;
    total += (Number(e.horas)||0) * 3600000;
  });
  return total;
}
function bancoHorasSaldoMs(hastaFecha){ return bancoHorasGeneradoMs(hastaFecha) - bancoHorasCompensadoMs(hastaFecha); }

const FESTIVOS_NAVARRA = {
  2026: [
    {fecha:'2026-01-01', nombre:'Año Nuevo'},
    {fecha:'2026-01-06', nombre:'Epifanía del Señor'},
    {fecha:'2026-03-19', nombre:'San José'},
    {fecha:'2026-04-02', nombre:'Jueves Santo'},
    {fecha:'2026-04-03', nombre:'Viernes Santo'},
    {fecha:'2026-04-06', nombre:'Lunes de Pascua'},
    {fecha:'2026-05-01', nombre:'Día del Trabajo'},

// Franja horaria de comida preconfigurada (p.ej. 14:00-14:45) aplicada al
// calendario de un día concreto. Si "fin" es menor o igual que "inicio" se
// interpreta que la franja cruza la medianoche. Si ese día tiene un override
// (ver comidaOverrideDeFecha), se usa esa franja en vez de la de Ajustes.
function comidaHorarioParaFecha(fechaStr){
  const cfg = DATA.config;
  const override = comidaOverrideDeFecha(fechaStr);
  const d = parseDateLocal(fechaStr);
  const [hi, mi] = (override?.inicio || cfg.comidaInicio || '14:00').split(':').map(Number);
  const [hf, mf] = (override?.fin || cfg.comidaFin || '14:45').split(':').map(Number);
  const inicio = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hi, mi).getTime();
  let fin = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hf, mf).getTime();
  if(fin <= inicio) fin += 24*3600000;
  return { inicio, fin };
}
function overlapMs(aIni, aFin, bIni, bFin){
  return Math.max(0, Math.min(aFin, bFin) - Math.max(aIni, bIni));
}

/*
 * Motor de cálculo de UN tramo (una entrada/salida). Usa SIEMPRE timestamps
 * reales (ms desde época), nunca resta de strings "HH:MM", por lo que
 * gestiona correctamente turnos nocturnos, cambios de día y jornadas de
 * cualquier duración.
 *
 *   TIEMPO BRUTO     = salida - entrada
 *   TIEMPO NO TRAB.  = descansos + comida (0 si ese día se avisó "no he comido")
 *   TIEMPO EFECTIVO  = bruto - noTrabajado
 *   HORAS NORMALES   = min(efectivo, jornadaConfigurada)
 *   HORAS EXTRA      = max(0, efectivo - jornadaConfigurada), y SOLO cuenta
 *                      si ese día está marcado como "día de viaje": el resto
 *                      de días, ese exceso sigue formando parte del tiempo
 *                      efectivo pero no se contabiliza como hora extra ni
 *                      suma al banco de horas.
 *
 * IMPORTANTE: si un día tiene varios tramos (se ficha entrada/salida más de
 * una vez), el límite "jornadaConfigurada" NO debe aplicarse por separado en
 * cada tramo (repartiría mal las horas extra). Para cualquier cálculo que
 * represente un DÍA completo, usar calcDia(fecha), que suma los tramos y
 * aplica el límite una sola vez.
 */
function calcJornada(j, now = Date.now()){
  const entrada = j.entrada;
  const salidaReal = j.salida;
  const abierta = salidaReal == null;
  const finParaCalculo = abierta ? now : salidaReal;
  const bruto = Math.max(0, finParaCalculo - entrada);

  const cfg = DATA.config;
  let descansosMs, comidasMs;
  const diaAplicaComida = diaConfigFor(j.fecha)?.comida !== false && !diaSinComida(j.fecha);

  if(cfg.modoDescanso === 'auto'){
    descansosMs = Math.min(bruto, (cfg.descansoMin || 0) * 60000);
  } else {
    descansosMs = sumIntervals(j.descansos, now);
  }
  if(!diaAplicaComida){
    comidasMs = cfg.modoComida === 'manual' ? sumIntervals(j.comidas, now) : 0;
  } else if(cfg.modoComida === 'auto'){
    comidasMs = Math.min(Math.max(0, bruto - descansosMs), (cfg.comidaMin || 0) * 60000);
  } else if(cfg.modoComida === 'horario'){
    const franja = comidaHorarioParaFecha(j.fecha);
    comidasMs = overlapMs(entrada, finParaCalculo, franja.inicio, franja.fin);
  } else {
    comidasMs = sumIntervals(j.comidas, now);
  }

  const efectivoTotal = Math.max(0, bruto - descansosMs - comidasMs);

  const normalMax = jornadaNormalMsForFecha(j.fecha);
  const normal = Math.min(efectivoTotal, normalMax);
  const excedente = Math.max(0, efectivoTotal - normalMax);
  const esViaje = diaEsViaje(j.fecha);
  const extra = esViaje ? excedente : 0;

  return {
    bruto, descansosMs, comidasMs, efectivoTotal,
    normalMax, normal, extra, abierta, esViaje,
    dAbierto: descansoAbierto(j), cAbierta: comidaAbierta(j)
  };
}

/*
 * Agrega TODOS los tramos (fichajes de entrada/salida) de un mismo día: si un
 * día se ficha varias veces, las horas de cada tramo se SUMAN y el límite de
 * la jornada normal (y por tanto las horas extra) se aplica UNA SOLA VEZ
 * sobre el total del día, en vez de por separado en cada tramo (lo que
 * podría "perder" horas extra repartidas entre dos tramos que individualmente
 * no superan la jornada normal pero sí lo hacen sumados).
 */
function calcDia(fecha, now = Date.now()){
  const jornadas = jornadasDeFecha(fecha);
  const calcs = jornadas.map(j => calcJornada(j, now));
  const bruto = calcs.reduce((s,c) => s + c.bruto, 0);
  const descansosMs = calcs.reduce((s,c) => s + c.descansosMs, 0);
  const comidasMs = calcs.reduce((s,c) => s + c.comidasMs, 0);
  const efectivoTotal = calcs.reduce((s,c) => s + c.efectivoTotal, 0);

  const normalMax = jornadaNormalMsForFecha(fecha);
  const normal = Math.min(efectivoTotal, normalMax);
  const excedente = Math.max(0, efectivoTotal - normalMax);
  const esViaje = diaEsViaje(fecha);
  const extra = esViaje ? excedente : 0;
  const abierta = calcs.some(c => c.abierta);

  return { jornadas, calcs, bruto, descansosMs, comidasMs, efectivoTotal, normalMax, normal, extra, abierta, esViaje };
}

function estadoActual(){
  const j = jornadaAbierta();
  if(!j) return 'fuera';
  if(descansoAbierto(j)) return 'descanso';
  if(comidaAbierta(j)) return 'comida';
  if(DATA.config.modoComida === 'horario' && diaConfigFor(j.fecha)?.comida !== false){
    const franja = comidaHorarioParaFecha(j.fecha);
    const now = Date.now();
    if(now >= franja.inicio && now < franja.fin) return 'comida';
  }
  return 'trabajando';
}

/* ----------------------------- Toast / confirmaciones -------------------- */
function toast(msg, ms = 2600){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s ease'; el.style.opacity = '0'; setTimeout(()=>el.remove(), 250); }, ms);
}

function openModal(html, opts = {}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay ${opts.center ? 'center':''}" id="activeModalOverlay"><div class="modal-box">${html}</div></div>`;
  const overlay = document.getElementById('activeModalOverlay');
  overlay.addEventListener('click', (e) => { if(e.target === overlay && !opts.persistent) closeModal(); });
  if(opts.onOpen) opts.onOpen(overlay);
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '';
}
function confirmDialog(message, okLabel = 'Eliminar', danger = true){
  return new Promise(resolve => {
    openModal(`
      <div class="modal-head"><h3>Confirmar</h3><button class="modal-close" data-action="cerrar-confirm">✕</button></div>
      <p style="margin-bottom:18px;color:var(--muted);font-size:14.5px;line-height:1.5;">${esc(message)}</p>
      <div class="btn-row">
        <button class="btn btn-outline" data-action="cancelar-confirm">Cancelar</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" data-action="aceptar-confirm">${esc(okLabel)}</button>
      </div>
    `, {center:true, persistent:true});
    document.getElementById('activeModalOverlay').addEventListener('click', (e) => {
      const act = e.target.closest('[data-action]');
      if(!act) return;
      if(act.dataset.action === 'aceptar-confirm'){ closeModal(); resolve(true); }
      else if(act.dataset.action === 'cancelar-confirm' || act.dataset.action === 'cerrar-confirm'){ closeModal(); resolve(false); }
    });
  });
}

  const now = Date.now();
  DATA.jornadas.push({
    id: uid(), fecha: todayStr(new Date(now)), entrada: now, salida: null,
    descansos: [], comidas: [], observaciones: ''
  });
  save();
  toast(`Entrada registrada a las ${fmtTimeHM(now)}`);

}
async function accionFicharSalida(){
  const j = jornadaAbierta();
  if(!j){ toast('No hay ningún fichaje abierto.'); return; }
  if(descansoAbierto(j)){ toast('Finaliza el descanso antes de fichar la salida.'); return; }
  if(comidaAbierta(j)){ toast('Finaliza la comida antes de fichar la salida.'); return; }
  const now = Date.now();
  if(now < j.entrada){ toast('La salida no puede ser anterior a la entrada.'); return; }
  j.salida = now;
  save();
  const fecha = j.fecha;
  const calc = calcDia(fecha, now);
  toast(`Salida registrada a las ${fmtTimeHM(now)}` + (calc.extra > 0 ? ` · ${fmtHM(calc.extra)} de horas extra` : ''));
  renderAll();

  // El día puede tener horas por encima de la jornada normal configurada: en
  // vez de decidir si imputan mientras se trabaja, se pregunta al fichar la
  // salida (una sola vez por día, mientras no esté ya marcado).
  const excedente = Math.max(0, calc.efectivoTotal - calc.normalMax);
  if(excedente > 0 && !diaEsViaje(fecha)){
    const imputable = await confirmDialog(
      `Has trabajado ${fmtHM(excedente)} por encima de tu jornada normal de hoy. ¿Estas horas extra son imputables?`,
      'Sí, imputar', false
    );
    if(imputable) abrirFormularioViaje(fecha);
  }
}

/*
 * Formulario para fijar manualmente la hora de comida de un día (desde la
 * pestaña Hoy), sin tener que pulsar "Iniciar/Finalizar comida" en directo.
 * Su comportamiento depende del modo de comida configurado en Ajustes:
 *  - 'horario' (franja fija tipo 14:00-14:45 para todos los días): guarda un
 *    override que sustituye esa franja SOLO ese día (ver comidaOverride).
 *  - 'manual' (se ficha con Iniciar/Finalizar): crea o corrige directamente
 *    el intervalo de comida de la jornada de ese día.
 *  - 'auto' (duración fija descontada automáticamente): no tiene una hora de
 *    reloj que editar, así que esta opción no se ofrece en ese modo.
 */
function abrirFormularioComidaHoy(fecha){
  const modo = DATA.config.modoComida;
  if(modo === 'horario'){
    const actual = comidaOverrideDeFecha(fecha);
    const ini = actual?.inicio || DATA.config.comidaInicio || '14:00';
    const fin = actual?.fin || DATA.config.comidaFin || '14:45';
    openModal(`
      <div class="modal-head"><h3>Hora de comida</h3><button class="modal-close" data-action="cerrar-modal">✕</button></div>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:14px;">Cambia la franja de comida solo para <b>${esc(fmtDateHuman(fecha))}</b>, sin tocar el horario habitual de Ajustes.</p>
      <div class="field-row">
        <div class="field"><label>Inicio</label><input type="time" id="frmComidaHoyIni" value="${ini}"></div>
        <div class="field"><label>Fin</label><input type="time" id="frmComidaHoyFin" value="${fin}"></div>
      </div>
      <button class="btn btn-primary btn-lg" data-action="guardar-comida-hoy" data-fecha="${fecha}">Guardar</button>
      ${actual ? `<button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;" data-action="quitar-comida-override" data-fecha="${fecha}">↩ Usar horario habitual</button>` : ''}
    `);
    return;
  }
  if(modo === 'manual'){
    const jornadas = jornadasDeFecha(fecha);
    const jObjetivo = jornadas.find(j => j.salida == null) || jornadas[jornadas.length - 1];
    if(!jObjetivo){ toast('Primero debes fichar la entrada.'); return; }
    const comidaExistente = jObjetivo.comidas[jObjetivo.comidas.length - 1] || null;
    const iniVal = comidaExistente ? fmtTimeHM(comidaExistente.inicio) : '';
    const finVal = (comidaExistente && comidaExistente.fin != null) ? fmtTimeHM(comidaExistente.fin) : '';
    openModal(`
      <div class="modal-head"><h3>Hora de comida</h3><button class="modal-close" data-action="cerrar-modal">✕</button></div>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:14px;">${comidaExistente ? 'Corrige' : 'Introduce'} la hora de inicio y fin de la comida de hoy.</p>
      <div class="field-row">
        <div class="field"><label>Inicio</label><input type="time" id="frmComidaHoyIni" value="${iniVal}"></div>
        <div class="field"><label>Fin</label><input type="time" id="frmComidaHoyFin" value="${finVal}"></div>
      </div>
      <button class="btn btn-primary btn-lg" data-action="guardar-comida-hoy" data-fecha="${fecha}" data-jid="${jObjetivo.id}" data-cid="${comidaExistente ? comidaExistente.id : ''}">Guardar</button>
    `);
    return;
  }
  toast('El modo de comida actual (duración automática) no usa una hora fija que editar.');
}
function guardarComidaHoy(fecha, jid, cid){
  const modo = DATA.config.modoComida;
  const iniStr = document.getElementById('frmComidaHoyIni').value;
  const finStr = document.getElementById('frmComidaHoyFin').value;
  if(!iniStr || !finStr){ toast('Indica hora de inicio y fin.'); return; }

  if(modo === 'horario'){
    if(finStr <= iniStr){ toast('El fin debe ser posterior al inicio.'); return; }
    marcarComidaOverride(fecha, iniStr, finStr);
    closeModal();
    toast('Hora de comida de hoy actualizada');
    renderAll();
    return;
  }

  const j = getJornada(jid);
  if(!j){ toast('No se encontró el fichaje de hoy.'); return; }
  const inicio = timeStrEnFecha(fecha, iniStr);
  const fin = timeStrEnFecha(fecha, finStr);
  if(inicio == null || fin == null){ toast('Hora inválida.'); return; }
  if(fin <= inicio){ toast('El fin debe ser posterior al inicio.'); return; }
  if(cid){
    const item = j.comidas.find(c => c.id === cid);
    if(item){ item.inicio = inicio; item.fin = fin; }
    else j.comidas.push({ id: uid(), inicio, fin });
  } else {
    j.comidas.push({ id: uid(), inicio, fin });
  }
  save();
  closeModal();
  toast('Hora de comida de hoy actualizada');
  renderAll();
}
function accionQuitarComidaOverride(fecha){
  quitarComidaOverride(fecha);
  toast('Se usará el horario de comida habitual');
  renderAll();
}

/*
 * Aviso de "todavía no has fichado". Solo se puede comprobar mientras la
 * app está abierta (sin backend no hay forma de avisar con la app cerrada):
 * se reevalúa cada segundo mientras el usuario tiene la app en pantalla.
 */
function debeAvisarFichaje(){
  const cfg = DATA.config;
  if(!cfg.avisoEntradaActivo) return false;
  if(UI.avisoDescartadoFecha === todayStr()) return false;
  const dia = diaConfigFor(todayStr());
  if(!dia || dia.activo === false) return false;
  if(diaCalendarioLaboral(todayStr())) return false;
  if(jornadasDeFecha(todayStr()).length || jornadaAbierta()) return false;
  const [h, m] = (cfg.avisoEntradaHora || '08:30').split(':').map(Number);
  const limite = new Date();
  limite.setHours(h, m, 0, 0);
  return Date.now() >= limite.getTime();
}

  const j = getJornada(id);
  if(!j) return;
  openModal(`
    <div class="modal-head"><h3>Indicar hora real de salida</h3><button class="modal-close" data-action="cerrar-modal">✕</button></div>
    <div class="field">
      <label>Fecha y hora de salida</label>
      <input type="datetime-local" id="frmSalidaManual" value="${toDatetimeLocalValue(Date.now())}">
    </div>
    <button class="btn btn-primary btn-lg" data-action="confirmar-salida-manual-abierto" data-id="${j.id}">Guardar salida</button>
  `);
}
function confirmarSalidaManualAbierto(id){
  const j = getJornada(id);
  const ts = fromDatetimeLocalValue(document.getElementById('frmSalidaManual').value);
  if(ts == null){ toast('Fecha inválida.'); return; }
  if(ts < j.entrada){ toast('La salida no puede ser anterior a la entrada.'); return; }
  j.salida = ts;
  save();
  closeModal();
  toast('Salida registrada a las ' + fmtTimeHM(ts));
  renderAll();
}

/* ----------------------------- Render: pestaña HOY ------------------------ */
function renderHoy(){
  const el = document.getElementById('tab-hoy');
  const now = Date.now();
  const j = jornadaAbierta();
  const estado = estadoActual();
  const cfg = DATA.config;

  let heroClass = 'estado-fuera';
  let heroLabel = 'FUERA DEL TRABAJO';
  if(estado==='trabajando'){ heroClass=''; heroLabel='TRABAJANDO'; }
  else if(estado==='descanso'){ heroClass='estado-descanso'; heroLabel='EN DESCANSO'; }
  else if(estado==='comida'){ heroClass='estado-comida'; heroLabel='EN COMIDA'; }

  let heroTimerValue = '00:00:00';
  let heroTimerLabel = 'Sin fichaje abierto';
  let extraBlock = '';
  let progressPct = 0, progressExtra = false, progressLabel = '';
  let subStats = '';

  if(j){
    // Se usa calcDia (no calcJornada) porque un mismo día puede tener varios
    // tramos fichados: el contador en vivo de horas extra tiene que reflejar
    // el total acumulado del día, no solo el tramo actualmente abierto (si no,
    // al reabrir un tramo nuevo después de ya haber cumplido la jornada en un
    // tramo anterior, las horas extra dejarían de contarse correctamente).
    const calc = calcDia(j.fecha, now);
    const dAbiertoTramo = descansoAbierto(j);
    const cAbiertaTramo = comidaAbierta(j);
    const desdeEntrada = now - j.entrada;
    heroTimerValue = fmtHMS(desdeEntrada);
    heroTimerLabel = `Trabajando desde las ${fmtTimeHM(j.entrada)}`;
    if(estado==='descanso') heroTimerLabel = `En descanso desde las ${fmtTimeHM(dAbiertoTramo.inicio)}`;
    if(estado==='comida'){
      heroTimerLabel = cAbiertaTramo
        ? `En comida desde las ${fmtTimeHM(cAbiertaTramo.inicio)}`
        : `En comida (horario ${comidaHorarioTextoFecha(j.fecha)})`;
    }

    progressPct = calc.normalMax > 0 ? clamp((calc.efectivoTotal/calc.normalMax)*100, 0, 100) : 0;
    progressExtra = calc.extra > 0;
    progressLabel = `${fmtHM(calc.efectivoTotal)} / ${fmtHM(calc.normalMax)}`;

    const excedenteSinViaje = !calc.esViaje && calc.efectivoTotal > calc.normalMax;
    extraBlock = `
      <div class="hero-extra">
        <div>
          <strong id="liveExtra">${fmtHMS(calc.extra)}</strong>
          <span>HORAS EXTRA${calc.extra>0 ? ' · en aumento' : ''}</span>
        </div>
      </div>
      ${excedenteSinViaje ? `<p style="font-size:11.5px;opacity:.85;margin-top:6px;">Hoy no está marcado como día de viaje: el tiempo de más no cuenta como hora extra.</p>` : ''}`;

    const restante = Math.max(0, calc.normalMax - calc.efectivoTotal);
    // Si la comida es de horario fijo y todavía no ha terminado, se suma el
    // tramo pendiente a la estimación (se sabe que ocurrirá aunque no haya
    // empezado). La comida ya tomada está incluida en "restante" porque
    // calcDia() ya la descuenta del tiempo efectivo de todo el día.
    let comidaPendiente = 0;
    if(DATA.config.modoComida === 'horario' && diaConfigFor(j.fecha)?.comida !== false){
      const franja = comidaHorarioParaFecha(j.fecha);
      comidaPendiente = Math.max(0, franja.fin - Math.max(now, franja.inicio));
    }
    const estimadaFin = now + restante + comidaPendiente;

    subStats = `
      <div class="hero-sub">
        <div class="item"><b id="liveEfectivo">${fmtHM(calc.efectivoTotal)}</b><small>Trabajo efectivo</small></div>
        <div class="item"><b>${fmtHM(calc.normalMax)}</b><small>Jornada prevista</small></div>
        <div class="item"><b id="liveRestante">${calc.extra>0 ? '00:00' : fmtHM(restante)}</b><small>Tiempo restante</small></div>
        <div class="item"><b>${calc.abierta ? fmtTimeHM(estimadaFin) : fmtTimeHM(j.salida)}</b><small>${calc.abierta?'Fin estimado':'Hora de salida'}</small></div>
      </div>`;
  } else {
    heroTimerValue = '—';
  }

  const heroHtml = `
    <div class="hero ${heroClass}" id="heroBox">
      <div class="hero-top">
        <span class="badge-estado"><span class="dot"></span>${heroLabel}</span>
        <span class="hero-fecha">${esc(fmtDateHuman(todayStr()))}</span>
      </div>
      <div class="hero-timer" id="heroTimer">${heroTimerValue}</div>
      <div class="hero-timer-label">${esc(heroTimerLabel)}</div>
      ${j ? extraBlock : ''}
      ${j ? subStats : `<p style="opacity:.9;font-size:14px;">Pulsa «Fichar entrada» para empezar tu jornada.</p>`}
      ${j ? `
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill ${progressExtra?'extra':''}" id="progressFill" style="width:${progressPct}%"></div></div>
        <div class="progress-text"><span id="progressLabel">${progressLabel}</span><span>${progressExtra?'⚡ Horas extra':''}</span></div>
      </div>` : ''}
    </div>`;

  // Botones de acción principal
  let mainBtn;
  if(!j){
    mainBtn = `<button class="btn btn-primary btn-lg" data-action="fichar-entrada">▶ FICHAR ENTRADA</button>`;
  } else {
    mainBtn = `<button class="btn btn-danger btn-lg" data-action="fichar-salida">⏹ FICHAR SALIDA</button>`;
  }

  let descansoBtn = '', comidaBtn = '';
  if(j && cfg.modoDescanso === 'manual'){
    const d = descansoAbierto(j);
    descansoBtn = d
      ? `<button class="btn btn-danger" data-action="finalizar-descanso">⏸ FINALIZAR DESCANSO</button>`
      : `<button class="btn btn-descanso" data-action="iniciar-descanso" ${comidaAbierta(j)?'disabled':''}>☕ INICIAR DESCANSO</button>`;
  }
  if(j && cfg.modoComida === 'manual' && diaConfigFor(j.fecha)?.comida !== false && !diaSinComida(j.fecha)){
    const c = comidaAbierta(j);
    comidaBtn = c
      ? `<button class="btn btn-danger" data-action="finalizar-comida">⏸ FINALIZAR COMIDA</button>`
      : `<button class="btn btn-comida" data-action="iniciar-comida" ${descansoAbierto(j)?'disabled':''}>🍽 INICIAR COMIDA</button>`;
  }

  const detalle = j ? (() => {
    const calc = calcDia(j.fecha, now);
    return `
    <div class="card">
      <h2>Detalle de hoy</h2>
      <div class="card-row"><span class="label">Hora entrada</span><span class="value">${fmtTimeHM(j.entrada)}</span></div>
      <div class="card-row"><span class="label">Descansos</span><span class="value">${fmtHM(calc.descansosMs)}</span></div>
      <div class="card-row"><span class="label">Comida${DATA.config.modoComida==='horario' ? ` (${comidaHorarioTextoFecha(j.fecha)})` : ''}</span><span class="value">${fmtHM(calc.comidasMs)}</span></div>
      <div class="card-row"><span class="label">Horas normales</span><span class="value">${fmtHM(calc.normal)}</span></div>
      <div class="card-row"><span class="label">Horas extra</span><span class="value" style="color:var(--extra)">${fmtHM(calc.extra)}</span></div>
    </div>`;
  })() : '';

  // La imputación (viaje/reunión) ya no se elige a mano durante la jornada:
  // se pregunta automáticamente al fichar la salida si hay horas por encima
  // de la jornada normal (ver accionFicharSalida). Aquí solo se muestra el
  // resultado, con opción de editarlo o quitarlo.
  const fechaHoy = todayStr();
  const viajeHoy = obtenerViaje(fechaHoy);
  const viajeSeccion = (viajeHoy && viajeHoy.activo) ? (() => {
    const esTipoViaje = viajeHoy.tipo !== 'reunion';
    const icono = esTipoViaje ? '🧳' : '🤝';
    const etiqueta = esTipoViaje ? 'Día de viaje' : 'Reunión';
    const detalleVal = esTipoViaje
      ? `${esc(viajeHoy.lugar || 'Sin lugar')}${viajeHoy.cliente ? ` · ${esc(viajeHoy.cliente)}` : ''}`
      : esc(viajeHoy.cliente || 'Sin cliente');
    return `
    <div class="card-row">
      <span class="label">${icono} ${etiqueta}</span>
      <span class="value">${detalleVal}</span>
    </div>
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn btn-soft btn-sm" data-action="abrir-form-viaje" data-fecha="${fechaHoy}">✎ Editar</button>
      <button class="btn btn-outline btn-sm" data-action="quitar-viaje" data-fecha="${fechaHoy}" style="color:var(--danger);border-color:var(--danger)">Quitar marca</button>
    </div>`;
  })() : '';

  const diaCfgHoy = diaConfigFor(fechaHoy);
  const puedeSinComida = diaCfgHoy?.comida !== false;
  let sinComidaSeccion = '';
  if(puedeSinComida){
    const modificarHoraBtn = cfg.modoComida !== 'auto'
      ? `<button class="btn btn-soft btn-sm" data-action="abrir-form-comida-hoy" data-fecha="${fechaHoy}">✎ Modificar hora</button>` : '';
    const principalBtn = diaSinComida(fechaHoy)
      ? `<button class="btn btn-soft btn-sm" data-action="quitar-sin-comida" data-fecha="${fechaHoy}">↩ Deshacer</button>`
      : `<button class="btn btn-outline btn-sm" data-action="marcar-sin-comida" data-fecha="${fechaHoy}">🚫 No he comido hoy</button>`;
    sinComidaSeccion = `
      ${diaSinComida(fechaHoy) ? `<div class="card-row"><span class="label">🚫 Comida</span><span class="value">No se descuenta hoy</span></div>` : ''}
      <div class="btn-row${modificarHoraBtn ? '' : ' single'}">${principalBtn}${modificarHoraBtn}</div>`;
  }

  el.innerHTML = `
    ${heroHtml}
    <div class="card" style="box-shadow:none;border:none;background:none;padding:0;margin-bottom:14px;">
      <div class="btn-row single" style="margin-bottom:10px;">${mainBtn}</div>
      <div class="btn-row">${descansoBtn}${comidaBtn}</div>
    </div>
    ${viajeSeccion ? `
    <div class="card">
      <h2>Viaje / reunión de hoy</h2>
      ${viajeSeccion}
    </div>` : ''}
    ${sinComidaSeccion ? `
    <div class="card">
      <h2>Comida de hoy</h2>
      ${sinComidaSeccion}
    </div>` : ''}
    ${detalle}
  `;
}

/* Actualiza sólo los números en vivo cada segundo, sin re-renderizar todo */
function tickLive(){
  renderBanner();
  if(UI.tab !== 'hoy') return;
  const j = jornadaAbierta();
  if(!j){ return; }
  const now = Date.now();
  const calc = calcDia(j.fecha, now);
  const heroTimer = document.getElementById('heroTimer');
  const liveExtra = document.getElementById('liveExtra');
  const liveEfectivo = document.getElementById('liveEfectivo');
  const liveRestante = document.getElementById('liveRestante');
  const progressFill = document.getElementById('progressFill');
  const progressLabel = document.getElementById('progressLabel');
  if(heroTimer){
    const estado = estadoActual();
    const dAbierto = descansoAbierto(j);
    const cAbierta = comidaAbierta(j);
    if(estado==='descanso' && dAbierto) heroTimer.textContent = fmtHMS(now - dAbierto.inicio);
    else if(estado==='comida' && cAbierta) heroTimer.textContent = fmtHMS(now - cAbierta.inicio);
    else heroTimer.textContent = fmtHMS(now - j.entrada);
  }
  if(liveExtra) liveExtra.textContent = fmtHMS(calc.extra);
  if(liveEfectivo) liveEfectivo.textContent = fmtHM(calc.efectivoTotal);
  if(liveRestante) liveRestante.textContent = calc.extra>0 ? '00:00' : fmtHM(Math.max(0, calc.normalMax-calc.efectivoTotal));
  if(progressFill){
    const pct = calc.normalMax>0 ? clamp((calc.efectivoTotal/calc.normalMax)*100,0,100) : 0;
    progressFill.style.width = pct+'%';
    progressFill.classList.toggle('extra', calc.extra>0);
  }
  if(progressLabel) progressLabel.textContent = `${fmtHM(calc.efectivoTotal)} / ${fmtHM(calc.normalMax)}`;
  // Aviso al alcanzar la jornada prevista (una sola vez)
  if(calc.extra > 0 && !j._avisoExtraDado){
    j._avisoExtraDado = true;
    toast('Has completado tu jornada normal. Estás acumulando horas extra.');
  }
  renderBanner();
}

/* ----------------------------- Render: pestaña HISTORICO ------------------ */
function rangoParaFiltro(){
  const f = UI.historico.filtro;
  const hoy = todayStr();
  if(f === 'hoy') return [hoy, hoy];
  if(f === 'semana'){
    const d = parseDateLocal(hoy);
    const dow = (d.getDay()+6)%7; // lunes=0
    const ini = addDays(hoy, -dow);
    const fin = addDays(ini, 6);
    return [ini, fin];
  }
  if(f === 'mes'){
    const d = parseDateLocal(hoy);
    const ini = `${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`;
    const finD = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return [ini, todayStr(finD)];
  }
  if(f === 'mesAnterior'){
    const d = parseDateLocal(hoy);
    const m = new Date(d.getFullYear(), d.getMonth()-1, 1);
    const ini = todayStr(m);
    const finD = new Date(m.getFullYear(), m.getMonth()+1, 0);
    return [ini, todayStr(finD)];
  }
  return [UI.historico.rangoIni, UI.historico.rangoFin];
}

function diasEnRango(ini, fin){
  const set = new Set();
  DATA.jornadas.forEach(j => { if(j.fecha >= ini && j.fecha <= fin) set.add(j.fecha); });
  Object.keys(DATA.viajes).forEach(f => { if(f >= ini && f <= fin) set.add(f); });
  Object.keys(DATA.sinComida).forEach(f => { if(f >= ini && f <= fin) set.add(f); });
  return [...set].sort((a,b)=> b < a ? -1 : b > a ? 1 : 0);
}

function statsDia(fecha){
  const jornadas = jornadasDeFecha(fecha);
  const calc = jornadas.length ? calcDia(fecha, Date.now()) : null;
  return { jornadas, calc, esViaje: diaEsViaje(fecha), viaje: obtenerViaje(fecha), sinComida: diaSinComida(fecha) };
}
// Texto compacto "08:00–12:00, 13:00–17:30" con todos los tramos de un día
// (o "en curso" en el tramo todavía abierto).
function formatTramosDia(jornadas){
  if(!jornadas.length) return '--:-- – --:--';
  return jornadas.map(j => `${fmtTimeHM(j.entrada)}–${j.salida ? fmtTimeHM(j.salida) : 'en curso'}`).join(', ');
}

function renderHistorico(){
  const el = document.getElementById('tab-historico');
  const [ini, fin] = rangoParaFiltro();
  const filtros = [
    ['hoy','Hoy'], ['semana','Esta semana'], ['mes','Este mes'], ['mesAnterior','Mes anterior'], ['rango','Rango']
  ];
  const chips = filtros.map(([k,l]) => `<button class="chip ${UI.historico.filtro===k?'active':''}" data-action="filtro-historico" data-filtro="${k}">${l}</button>`).join('');

  const rangoInputs = UI.historico.filtro === 'rango' ? `
    <div class="field-row" style="margin-bottom:12px;">
      <div class="field" style="margin-bottom:0;"><label>Desde</label><input type="date" id="rangoIniInput" value="${UI.historico.rangoIni}"></div>
      <div class="field" style="margin-bottom:0;"><label>Hasta</label><input type="date" id="rangoFinInput" value="${UI.historico.rangoFin}"></div>
    </div>` : '';

  let fechas = diasEnRango(ini, fin);
  const q = UI.historico.busqueda.trim().toLowerCase();
  if(q){
    fechas = fechas.filter(f => {
      const {jornadas, viaje} = statsDia(f);
      const obsTexto = jornadas.map(x => x.observaciones||'').join(' ');
      const hay = [f, obsTexto, viaje?.lugar||'', viaje?.cliente||''].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  if(UI.historico.soloViaje){
    fechas = fechas.filter(f => diaEsViaje(f));
  }

  const items = fechas.length ? fechas.map(f => {
    const {jornadas, calc, esViaje, viaje, sinComida} = statsDia(f);
    const openPill = calc && calc.abierta ? `<span class="pill open">Abierto</span>` : '';
    const viajePill = esViaje ? (viaje.tipo === 'reunion' ? `<span class="pill reunion">Reunión</span>` : `<span class="pill viaje">Viaje</span>`) : '';
    const sinComidaPill = sinComida ? `<span class="pill sincomida">Sin comida</span>` : '';
    const extraStat = esViaje ? `<span>Extra compensable <b style="color:var(--extra)">${calc?fmtHM(calc.extra):'00:00'}</b></span>` : '';
    return `
    <div class="day-item ${esViaje?'es-viaje':''}" data-action="ver-dia" data-fecha="${f}">
      <div class="di-top">
        <div class="di-date">${esc(fmtDateHuman(f))}<small>${esc(fmtDateShort(f))}</small></div>
        <div class="di-pills">${openPill}${viajePill}${sinComidaPill}</div>
      </div>
      <div class="di-stats">
        <span>${jornadas.length>1?'Tramos':'Horario'} <b>${esc(formatTramosDia(jornadas))}</b></span>
        <span>Total trabajado <b>${calc?fmtHM(calc.efectivoTotal):'00:00'}</b></span>
        ${extraStat}
      </div>
    </div>`;
  }).join('') : `<div class="empty-state"><div class="ic">📭</div>No hay registros en este periodo.</div>`;

  el.innerHTML = `
    <div class="hist-filters">${chips}</div>
    <div class="hist-filters hist-filters-secondary">
      <button class="chip ${UI.historico.soloViaje?'active':''}" data-action="toggle-solo-viaje">🧳 Solo viaje/reunión</button>
    </div>
    ${rangoInputs}
    <div class="field search-box">
      <input type="text" placeholder="Buscar en el histórico…" id="buscadorHistorico" value="${esc(UI.historico.busqueda)}">
    </div>
    ${items}
  `;
}

/* Genera una vista de impresión con el AÑO COMPLETO del calendario laboral
   en una sola página (Guardar como PDF), con los mismos colores que la app. */
function exportarCalendarioPDF(){
  const anio = parseDateLocal(UI.resumen.mesRef).getFullYear();
  const dowLabels = ['L','M','X','J','V','S','D'];

  const mesesHtml = [];
  for(let mes=0; mes<12; mes++){
    const firstDow = (new Date(anio, mes, 1).getDay()+6)%7;
    const totalDias = new Date(anio, mes+1, 0).getDate();
    let cells = dowLabels.map(d => `<div class="print-cal-dow">${d}</div>`).join('');
    for(let i=0;i<firstDow;i++) cells += `<div class="print-cal-day empty"></div>`;
    for(let d=1; d<=totalDias; d++){
      const fecha = `${anio}-${pad2(mes+1)}-${pad2(d)}`;
      const marca = diaCalendarioLaboral(fecha);
      const hayJornada = DATA.jornadas.some(x => x.fecha === fecha);
      const diaCfg = diaConfigFor(fecha);
      let cls = 'print-cal-day';
      if(marca){
        cls += ' ' + marca.tipo;
      } else if(hayJornada){
        const c = calcDia(fecha, Date.now());
        cls += c.extra>0 ? ' has-extra' : ' worked';
      } else if(diaCfg && diaCfg.activo === false){
        cls += ' weekend';
      }
      cells += `<div class="${cls}">${d}</div>`;
    }
    mesesHtml.push(`
      <div class="print-cal-month">
        <div class="print-cal-month-title">${MONTH_NAMES[mes]}</div>
        <div class="print-cal-grid">${cells}</div>
      </div>`);
  }

  const nombreTrabajador = DATA.perfil ? DATA.perfil.nombre : '';
  document.getElementById('printArea').innerHTML = `
    <div class="print-cal-title">Calendario laboral · ${anio}</div>
    <div class="print-cal-sub">${esc(nombreTrabajador)}</div>
    <div class="print-cal-year">${mesesHtml.join('')}</div>
    <div class="print-cal-legend">
      <div class="li"><span class="sw" style="background:#ede9fe;"></span>Trabajado</div>
      <div class="li"><span class="sw" style="background:#fed7aa;"></span>Con horas extra</div>
      <div class="li"><span class="sw" style="background:#f7f8fb;"></span>Fin de semana</div>
      <div class="li"><span class="sw" style="background:rgba(225,29,72,.16);"></span>Festivo</div>
      <div class="li"><span class="sw" style="background:rgba(22,163,74,.16);"></span>Vacaciones</div>
      <div class="li"><span class="sw" style="background:rgba(79,70,229,.16);"></span>Compensación</div>
    </div>
  `;
  setTimeout(() => window.print(), 50);
}

function crearJornadaManual(fecha){
  const d = parseDateLocal(fecha);
  d.setHours(8,0,0,0);
  DATA.jornadas.push({ id: uid(), fecha, entrada: d.getTime(), salida: null, descansos:[], comidas:[], observaciones:'' });
  save();
  closeModal();
  toast('Fichaje creado, edítalo con los datos correctos.');
  renderAll();
  verDia(fecha);
}
// Añade un tramo MÁS a un día que ya tiene al menos un fichaje (p.ej. se
// entra y sale, y más tarde se vuelve a entrar). Se coloca 1h después de que
// terminase el último tramo para que no se solape visualmente por defecto;
// el usuario lo ajusta con los datos reales a continuación.
function agregarTramoDia(fecha){
  const existentes = jornadasDeFecha(fecha);
  const ultima = existentes[existentes.length-1];
  const base = ultima ? (ultima.salida ?? ultima.entrada) + 3600000 : (() => {
    const d = parseDateLocal(fecha); d.setHours(8,0,0,0); return d.getTime();
  })();
  DATA.jornadas.push({ id: uid(), fecha, entrada: base, salida: null, descansos:[], comidas:[], observaciones:'' });
  save();
  toast('Tramo añadido, edítalo con los datos correctos.');
  renderAll();
  verDia(fecha);
}
function guardarJornadaEditada(id){
  const j = getJornada(id);

  const salidaVal = document.getElementById(`edJSalida-${id}`).value;

  if(entrada == null){ toast('Fecha de entrada inválida.'); return; }
  if(salida != null && salida < entrada){ toast('La salida no puede ser anterior a la entrada.'); return; }

/* ----------------------------- Render: pestaña RESUMEN -------------------- */
// Lunes (YYYY-MM-DD) de cada semana con al menos un fichaje, y clave "YYYY-MM"
// de cada mes con al menos un fichaje. Se usan para limitar la navegación de
// los resúmenes semanal/mensual a periodos con información real.
function semanasConFichajes(){
  const set = new Set();
  DATA.jornadas.forEach(j => {
    const dow = (parseDateLocal(j.fecha).getDay()+6)%7;
    set.add(addDays(j.fecha, -dow));
  });
  return set;
}
function mesesConFichajes(){
  const set = new Set();
  DATA.jornadas.forEach(j => set.add(j.fecha.slice(0, 7)));
  return set;
}
// hayAntes/hayDespues: si existe algún elemento del set estrictamente menor
// (o mayor) que "actual" — set y actual deben ser comparables como strings
// (fechas "YYYY-MM-DD" o claves "YYYY-MM", que ordenan bien lexicográficamente).
function haySetAntes(set, actual){ return [...set].some(v => v < actual); }
function haySetDespues(set, actual){ return [...set].some(v => v > actual); }

function agregarRango(ini, fin){
  const now = Date.now();
  let efectivo=0, normal=0, extra=0, descansos=0, comidas=0;
  // Se agrupa por DÍA (no por tramo) para que el límite de la jornada normal
  // se aplique una sola vez sobre el total del día (ver calcDia).
  const diasTrabajados = new Set(DATA.jornadas.filter(j => j.fecha >= ini && j.fecha <= fin).map(j => j.fecha));
  diasTrabajados.forEach(fecha => {
    const c = calcDia(fecha, now);
    efectivo += c.efectivoTotal; normal += c.normal; extra += c.extra;
    descansos += c.descansosMs; comidas += c.comidasMs;
  });
  return { efectivo, normal, extra, descansos, comidas, dias: diasTrabajados.size };
}

function renderResumen(){
  const el = document.getElementById('tab-resumen');
  const hoy = todayStr();

  // Semana del resumen semanal (navegable con ‹ ›, solo entre semanas con
  // fichajes, por defecto la actual)
  const dSem = parseDateLocal(UI.resumen.semanaRef);
  const dowSem = (dSem.getDay()+6)%7;
  const semIni = addDays(UI.resumen.semanaRef, -dowSem), semFin = addDays(semIni, 6);
  const rSem = agregarRango(semIni, semFin);
  const semanasDatos = semanasConFichajes();
  const haySemAnterior = haySetAntes(semanasDatos, semIni);
  const haySemSiguiente = haySetDespues(semanasDatos, semIni);

  // Mes del resumen mensual (navegable con ‹ ›, solo entre meses con
  // fichajes, por defecto el actual)
  const dMes = parseDateLocal(UI.resumen.mesResumenRef);
  const mesIni = `${dMes.getFullYear()}-${pad2(dMes.getMonth()+1)}-01`;
  const mesFinD = new Date(dMes.getFullYear(), dMes.getMonth()+1, 0);
  const mesFin = todayStr(mesFinD);
  const rMes = agregarRango(mesIni, mesFin);
  const mediaMes = rMes.dias>0 ? rMes.efectivo/rMes.dias : 0;
  const claveMesActual = UI.resumen.mesResumenRef.slice(0, 7);
  const mesesDatos = mesesConFichajes();
  const hayMesAnterior = haySetAntes(mesesDatos, claveMesActual);
  const hayMesSiguiente = haySetDespues(mesesDatos, claveMesActual);

  // Calendario del mes de referencia
  const ref = parseDateLocal(UI.resumen.mesRef);
  const firstDow = (new Date(ref.getFullYear(), ref.getMonth(), 1).getDay()+6)%7;
  const totalDias = new Date(ref.getFullYear(), ref.getMonth()+1, 0).getDate();

  for(let i=0;i<firstDow;i++) calCells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=totalDias; d++){
    const fecha = `${ref.getFullYear()}-${pad2(ref.getMonth()+1)}-${pad2(d)}`;

    if(fecha === hoy) cls += ' today';

      cls += ' ' + marca.tipo;

      const c = calcDia(fecha, Date.now());
      cls += c.extra>0 ? ' has-extra' : ' worked';
    } else if(diaCfg && diaCfg.activo === false){
      cls += ' weekend';
    }
    calCells += `<div class="${cls}" data-action="abrir-dia-calendario" data-fecha="${fecha}">${d}</div>`;
  }

  const bancoSaldo = bancoHorasSaldoMs();
  const bancoGenerado = bancoHorasGeneradoMs();
  const bancoCompensado = bancoHorasCompensadoMs();

  el.innerHTML = `
    <div class="card">
      <h2>Banco de horas</h2>
      <div class="summary-grid">

        <div class="summary-tile"><b style="color:var(--extra)">${fmtHM(bancoGenerado)}</b><small>Horas extra generadas</small></div>
        <div class="summary-tile"><b style="color:var(--compensacion)">${fmtHM(bancoCompensado)}</b><small>Ya compensadas</small></div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px;">Se calcula con las horas extra registradas en días marcados como "viaje" o "reunión" hasta hoy, menos los días que hayas marcado como "Compensación de horas" en el calendario de abajo.</p>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;">Calendario</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="icon-btn" data-action="cal-mes" data-dir="-1">‹</button>
          <span style="font-size:13px;font-weight:700;min-width:110px;text-align:center;">${MONTH_NAMES[ref.getMonth()]} ${ref.getFullYear()}</span>
          <button class="icon-btn" data-action="cal-mes" data-dir="1">›</button>
        </div>
      </div>
      <div class="cal-grid">${calCells}</div>
      <div class="cal-legend">
        <div class="li"><span class="sw" style="background:#ede9fe;"></span>Trabajado</div>
        <div class="li"><span class="sw" style="background:#fed7aa;"></span>Con horas extra</div>
        <div class="li"><span class="sw" style="background:var(--surface-2);border:1px solid var(--border);"></span>Fin de semana</div>
        <div class="li"><span class="sw" style="background:var(--festivo);"></span>Festivo</div>
        <div class="li"><span class="sw" style="background:var(--success);"></span>Vacaciones</div>
        <div class="li"><span class="sw" style="background:var(--compensacion);"></span>Compensación</div>
      </div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px;">Toca cualquier día para ver su fichaje o marcarlo como festivo, vacaciones o compensación de horas: así distribuyes las horas del banco de arriba.</p>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn btn-outline btn-sm" data-action="cargar-festivos-navarra">📅 Cargar festivos Navarra 2026</button>
        <button class="btn btn-outline btn-sm" data-action="exportar-calendario-pdf">🖨 Exportar calendario a PDF</button>
      </div>

    <div class="card">
