function periodoARango(periodo){
  const hoy = todayStr();
  if(periodo === 'mesActual'){
    const d = parseDateLocal(hoy);
    return [`${d.getFullYear()}-${pad2(d.getMonth()+1)}-01`, todayStr(new Date(d.getFullYear(), d.getMonth()+1, 0))];
  }
  if(periodo === 'mesAnterior'){
    const d = parseDateLocal(hoy);
    const m = new Date(d.getFullYear(), d.getMonth()-1, 1);
    return [todayStr(m), todayStr(new Date(m.getFullYear(), m.getMonth()+1, 0))];
  }
  if(periodo === 'semanaActual'){
    const d = parseDateLocal(hoy);
    const dow = (d.getDay()+6)%7;
    const ini = addDays(hoy, -dow);
    return [ini, addDays(ini,6)];
  }
  if(periodo === 'anioCompleto'){
    const d = parseDateLocal(hoy);
    return [`${d.getFullYear()}-01-01`, `${d.getFullYear()}-12-31`];
  }
  return [UI.export?.rangoIni || hoy, UI.export?.rangoFin || hoy];
}

function construirFilasExportacion(ini, fin, columnas){
  const idsSeleccionados = (columnas && columnas.length) ? columnas : COLUMNAS_EXPORT.map(c => c.id);
  const colsDef = COLUMNAS_EXPORT.filter(c => idsSeleccionados.includes(c.id));
  const nombreTrabajador = DATA.perfil ? DATA.perfil.nombre : '';
  const fechas = diasEnRango(ini, fin).sort();
  const filas = [];
  fechas.forEach(f => {
    // Un mismo día puede tener varios tramos fichados: se juntan las horas de
    // entrada/salida de cada uno y se suman sus totales (ver calcDia).
    const jornadasDia = jornadasDeFecha(f);
    const viaje = obtenerViaje(f);
    const dowName = DOW_NAMES[parseDateLocal(f).getDay()];
    if(jornadasDia.length){
      const c = calcDia(f, Date.now());
      filas.push({
        trabajador: nombreTrabajador, fecha: f, diaSemana: dowName,
        horaEntrada: jornadasDia.map(j => fmtTimeHM(j.entrada)).join(', '),
        horaSalida: jornadasDia.map(j => j.salida ? fmtTimeHM(j.salida) : '(abierto)').join(', '),
        tiempoBruto: hoursDecimal(c.bruto), descansos: hoursDecimal(c.descansosMs), comida: hoursDecimal(c.comidasMs),
        horasEfectivas: hoursDecimal(c.efectivoTotal), horasNormales: hoursDecimal(c.normal), horasExtra: hoursDecimal(c.extra),
        diaViaje: (viaje && viaje.activo) ? 'Sí' : 'No',
        tipoViaje: viaje ? (viaje.tipo === 'reunion' ? 'Reunión' : 'Viaje') : '',
        lugarViaje: viaje ? (viaje.lugar||'') : '', clienteViaje: viaje ? (viaje.cliente||'') : '',
        observaciones: jornadasDia.map(j => j.observaciones).filter(Boolean).join(' · ')
      });
    } else if(viaje && viaje.activo){
      filas.push({
        trabajador: nombreTrabajador, fecha: f, diaSemana: dowName,
        horaEntrada: '', horaSalida: '', tiempoBruto: '', descansos: '', comida: '',
        horasEfectivas: '', horasNormales: '', horasExtra: '',
        diaViaje: 'Sí', tipoViaje: viaje.tipo === 'reunion' ? 'Reunión' : 'Viaje',
        lugarViaje: viaje.lugar||'', clienteViaje: viaje.cliente||'',
        observaciones: ''
      });
    }
  });
  const headers = colsDef.map(c => c.label);
  const rows = filas.map(obj => colsDef.map(c => obj[c.id]));
  return { headers, rows };
}

function nombreArchivo(ini, fin, ext){
  const nombre = DATA.perfil ? '_' + DATA.perfil.nombre.trim().replace(/\s+/g,'_').replace(/[^A-Za-z0-9_ñÑáéíóúÁÉÍÓÚ-]/g,'') : '';
  if(ini === fin) return `fichajes${nombre}_${ini}.${ext}`;
  const d1 = parseDateLocal(ini), d2 = parseDateLocal(fin);
  if(d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth()){
    return `fichajes${nombre}_${d1.getFullYear()}_${pad2(d1.getMonth()+1)}.${ext}`;
  }
  return `fichajes${nombre}_${ini}_a_${fin}.${ext}`;
}
/*
 * Descarga de archivos. Cuando la app se ejecuta dentro del visor de
 * Artifacts de Claude, el navegador sandboxeado bloquea las descargas
 * mediante <a download>, así que se usa la capacidad "downloads" del
 * anfitrión si está disponible. Si la app se abre como archivo HTML
 * normal (doble clic, servidor propio), esa capacidad no existe y se
 * usa la descarga estándar del navegador.
 */
let _downloadsCap = null, _downloadsCapTried = false;
async function getDownloadsCapability(){
  if(_downloadsCapTried) return _downloadsCap;
  _downloadsCapTried = true;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      _downloadsCap = await window.claude.use('downloads');
    }
  }catch(e){ _downloadsCap = null; }
  return _downloadsCap;
}
async function descargarBlob(blob, filename, successMsg){
  const cap = await getDownloadsCapability();
  if(cap){
    try{
      await cap.save({ filename, data: blob });
      toast(successMsg || 'Archivo guardado');
    }catch(e){
      if(e && e.code === 'declined'){ return; }
      toast('No se pudo guardar el archivo' + (e && e.message ? ': ' + e.message : '.'));
    }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast(successMsg || 'Archivo descargado');
}

function exportarCSV(ini, fin, columnas){
  const { headers, rows } = construirFilasExportacion(ini, fin, columnas);
  const sep = ';';
  const escCsv = v => {
    const s = String(v ?? '');
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const lines = [headers.map(escCsv).join(sep), ...rows.map(r => r.map(escCsv).join(sep))];
  const csv = '﻿' + lines.join('\r\n');
  descargarBlob(new Blob([csv], {type:'text/csv;charset=utf-8'}), nombreArchivo(ini, fin, 'csv'), 'CSV exportado');
}

/* ---- Generador XLSX autocontenido (ZIP sin compresión + Open XML) ---- */
function crc32(bytes){
  let table = crc32._t;
  if(!table){
    table = crc32._t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
      table[n]=c>>>0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = table[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
class ByteWriter{
  constructor(){ this.chunks=[]; this.length=0; }
  bytes(a){ this.chunks.push(a); this.length+=a.length; }
  u16(v){ this.bytes(Uint8Array.of(v&0xFF,(v>>>8)&0xFF)); }
  u32(v){ this.bytes(Uint8Array.of(v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF)); }
  str(s){ this.bytes(new TextEncoder().encode(s)); }
  out(){ const o=new Uint8Array(this.length); let off=0; for(const c of this.chunks){o.set(c,off);off+=c.length;} return o; }
}
function buildZipStore(files){
  const w = new ByteWriter();
  const central = [];
  const time=0, date=0x21;
  for(const f of files){
    const nameBytes = new TextEncoder().encode(f.name);
    const crc = crc32(f.data);
    const offset = w.length;
    w.u32(0x04034b50); w.u16(20); w.u16(0); w.u16(0); w.u16(time); w.u16(date);
    w.u32(crc); w.u32(f.data.length); w.u32(f.data.length);
    w.u16(nameBytes.length); w.u16(0);
    w.bytes(nameBytes); w.bytes(f.data);
    central.push({nameBytes, crc, size:f.data.length, offset});
  }
  const cdStart = w.length;
  for(const e of central){
    w.u32(0x02014b50); w.u16(20); w.u16(20); w.u16(0); w.u16(0); w.u16(time); w.u16(date);
    w.u32(e.crc); w.u32(e.size); w.u32(e.size);
    w.u16(e.nameBytes.length); w.u16(0); w.u16(0); w.u16(0); w.u16(0); w.u32(0); w.u32(e.offset);
    w.bytes(e.nameBytes);
  }
  const cdSize = w.length - cdStart;
  w.u32(0x06054b50); w.u16(0); w.u16(0); w.u16(central.length); w.u16(central.length);
  w.u32(cdSize); w.u32(cdStart); w.u16(0);
  return w.out();
}
function escXml(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function colName(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function buildSheetXml(headers, rows){
  const headerCells = headers.map((h,i)=>`<c r="${colName(i)}1" t="inlineStr" s="1"><is><t xml:space="preserve">${escXml(h)}</t></is></c>`).join('');
  let xml = `<row r="1">${headerCells}</row>`;
  rows.forEach((row, ri) => {
    const r = ri+2;
    const cells = row.map((val, ci) => {
      const ref = colName(ci)+r;
      if(typeof val === 'number' && isFinite(val)) return `<c r="${ref}"><v>${val}</v></c>`;
      const s = val==null ? '' : String(val);
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escXml(s)}</t></is></c>`;
    }).join('');
    xml += `<row r="${r}">${cells}</row>`;
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${xml}</sheetData></worksheet>`;
}
/* Empaqueta un .xlsx mínimo (ZIP sin compresión + Open XML) a partir de una o
 * varias hojas ya construidas y de los estilos compartidos. Reutilizado por
 * el exportador genérico, el informe mensual individual y el Excel combinado
 * del equipo (una hoja por informe). */
function buildXlsxPackageMultiSheet(sheets, stylesXml){
  const enc = new TextEncoder();
  const worksheetOverrides = sheets.map((_,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('');
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${worksheetOverrides}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const sheetEntries = sheets.map((s,i) => `<sheet name="${escXml(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('');
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetEntries}</sheets></workbook>`;
  const wbRelParts = sheets.map((s,i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('');
  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRelParts}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const files = [
    {name:'[Content_Types].xml', data:enc.encode(contentTypes)},
    {name:'_rels/.rels', data:enc.encode(rootRels)},
    {name:'xl/workbook.xml', data:enc.encode(workbook)},
    {name:'xl/_rels/workbook.xml.rels', data:enc.encode(workbookRels)},
    {name:'xl/styles.xml', data:enc.encode(stylesXml)},
    ...sheets.map((s,i) => ({name:`xl/worksheets/sheet${i+1}.xml`, data:enc.encode(s.sheetXml)}))
  ];
  const zip = buildZipStore(files);
  return new Blob([zip], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsxPackage(sheetName, sheetXml, stylesXml){
  return buildXlsxPackageMultiSheet([{name:sheetName, sheetXml}], stylesXml);
}
// Nombres de hoja únicos y válidos para Excel (máx. 31 car., sin : \ / ? * [ ]).
function nombresHojaUnicos(nombresDeseados){
  const usados = new Set();
  return nombresDeseados.map(deseado => {
    let base = String(deseado || 'Hoja').replace(/[:\\/?*[\]]/g, ' ').trim().slice(0,31) || 'Hoja';
    let nombre = base, n = 2;
    while(usados.has(nombre.toLowerCase())){
      const sufijo = ' (' + n + ')';
      nombre = base.slice(0, 31 - sufijo.length) + sufijo;
      n++;
    }
    usados.add(nombre.toLowerCase());
    return nombre;
  });
}
const XLSX_ESTILOS_BASICOS = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`;
function buildXlsxBlob(sheetName, headers, rows){
  const sheet = buildSheetXml(headers, rows);
  return buildXlsxPackage(sheetName, sheet, XLSX_ESTILOS_BASICOS);
}
function exportarXLSX(ini, fin, columnas){
  const { headers, rows } = construirFilasExportacion(ini, fin, columnas);
  const blob = buildXlsxBlob('Fichajes', headers, rows);
  descargarBlob(blob, nombreArchivo(ini, fin, 'xlsx'), 'Excel exportado');
}

// Cabeceras/estilos/anchos comunes a cualquier hoja de "informe mensual"
// (tanto si lleva un único mes como si lleva varios apilados en la misma hoja).
function contextoHojaInformeMensual(){
  const headers = ['Fecha','Hora inicio','Hora fin','Horas efectivas','Horas extra','Horas compensadas','Comentario','Tipo'];
  const NUM_COLS = headers.length;
  const ULTIMA_COL = colName(NUM_COLS - 1);
  const cellXml = (colIdx, rowIdx, value, styleId) => {
    const ref = colName(colIdx) + rowIdx;
    const sAttr = styleId ? ` s="${styleId}"` : '';
    if(typeof value === 'number' && isFinite(value)) return `<c r="${ref}"${sAttr}><v>${value}</v></c>`;
    const s = value == null ? '' : String(value);
    return `<c r="${ref}"${sAttr} t="inlineStr"><is><t xml:space="preserve">${escXml(s)}</t></is></c>`;
  };
  const filaMerged = (rowIdx, texto, styleId) => `<row r="${rowIdx}">${cellXml(0, rowIdx, texto, styleId)}</row>`;

  return { headers, ULTIMA_COL, cellXml, filaMerged, colsXml };

// Escribe el bloque de un único mes (etiqueta + saldo inicial + cabecera +
// filas día a día + saldo final) a partir de la fila "r0", devolviendo el XML
// generado, sus fusiones de celdas y la fila siguiente libre.
function construirBloqueMesInforme(ctx, r0, mesLabel, saldoInicioMs, filas, saldoFinMs){
  const { headers, ULTIMA_COL, cellXml, filaMerged } = ctx;
  let r = r0;
  let xml = '';
  const merges = [];

  xml += filaMerged(r, 'Mes: ' + mesLabel, 1); merges.push(`A${r}:${ULTIMA_COL}${r}`); r++;
  xml += filaMerged(r, 'Horas extra acumuladas a inicio de mes: ' + fmtHMSigned(saldoInicioMs), 1); merges.push(`A${r}:${ULTIMA_COL}${r}`); r++;
  r++; // fila en blanco

  xml += `<row r="${r}">${headers.map((h,i) => cellXml(i, r, h, 1)).join('')}</row>`;
  r++;

  filas.forEach(f => {
    const styleId = INFORME_MENSUAL_ESTILO_POR_TIPO[f.tipo] || 0;
    const tipoLabel = INFORME_MENSUAL_TIPO_LABEL[f.tipo] || INFORME_MENSUAL_TIPO_LABEL.normal;
    const valores = [f.fecha, f.horaInicio, f.horaFin, f.horasEfectivas, f.horasExtra, f.horasCompensadas, f.comentario, tipoLabel];
    xml += `<row r="${r}">${valores.map((v,i) => cellXml(i, r, v, styleId)).join('')}</row>`;
    r++;
  });

  r++; // fila en blanco
  xml += filaMerged(r, 'Horas extra acumuladas después de este mes: ' + fmtHMSigned(saldoFinMs), 1); merges.push(`A${r}:${ULTIMA_COL}${r}`); r++;

  return { xml, merges, r };
}
function buildSheetXmlInformeMensual(nombre, mesLabel, saldoInicioMs, filas, saldoFinMs){
  const ctx = contextoHojaInformeMensual();
  let r = 1;
  let xml = '';
  const merges = [];

  xml += ctx.filaMerged(r, nombre || 'Trabajador', 2); merges.push(`A${r}:${ctx.ULTIMA_COL}${r}`); r++;
  const bloque = construirBloqueMesInforme(ctx, r, mesLabel, saldoInicioMs, filas, saldoFinMs);
  xml += bloque.xml; merges.push(...bloque.merges); r = bloque.r;

  const mergeXml = `<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${ctx.colsXml}<sheetData>${xml}</sheetData>${mergeXml}</worksheet>`;
}
// Hoja de un único empleado con TODOS sus meses apilados uno debajo de otro
// (mismo bloque por mes que el informe individual), usada por el Excel
// combinado del equipo para no tener que abrir una hoja distinta por mes.
function buildSheetXmlInformeMensualEmpleado(nombre, meses){
  const ctx = contextoHojaInformeMensual();
  let r = 1;
  let xml = '';
  const merges = [];

  xml += ctx.filaMerged(r, nombre || 'Trabajador', 2); merges.push(`A${r}:${ctx.ULTIMA_COL}${r}`); r++;
  r++; // fila en blanco tras el nombre

  meses.forEach(m => {
    const bloque = construirBloqueMesInforme(ctx, r, m.mesLabel, m.saldoInicioMs, m.filas, m.saldoFinMs);
    xml += bloque.xml; merges.push(...bloque.merges); r = bloque.r;
    r++; // fila en blanco entre un mes y el siguiente
  });

  const mergeXml = `<mergeCells count="${merges.length}">${merges.map(m => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>`;
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${ctx.colsXml}<sheetData>${xml}</sheetData>${mergeXml}</worksheet>`;
}
function buildXlsxBlobInformeMensual(nombre, mesLabel, saldoInicioMs, filas, saldoFinMs){
  const sheetXml = buildSheetXmlInformeMensual(nombre, mesLabel, saldoInicioMs, filas, saldoFinMs);
  return buildXlsxPackage('Informe mensual', sheetXml, buildStylesXmlInformeMensual());
}
// Clasifica cada día del mes (normal/viaje/festivo/vacaciones/compensación) y
// arma las columnas del informe mensual coloreado a partir de los datos ya
// guardados (fichajes, marcas de calendario y días de viaje).
function construirFilasInformeMensual(anio, mesIdx){
  const totalDias = new Date(anio, mesIdx+1, 0).getDate();
  const filas = [];
  for(let d=1; d<=totalDias; d++){
    const fecha = `${anio}-${pad2(mesIdx+1)}-${pad2(d)}`;
    // Un mismo día puede tener varios tramos fichados (entrada/salida repetidos
    // varias veces): se suman todos y el límite de la jornada normal (y por
    // tanto las horas extra) se aplica una sola vez sobre el total del día
    // en vez de por separado en cada tramo (ver calcDia).
    const jornadasDia = jornadasDeFecha(fecha);
    const marca = diaCalendarioLaboral(fecha);
    const viaje = obtenerViaje(fecha);
    const calc = jornadasDia.length ? calcDia(fecha, Date.now()) : null;

    let tipo = 'normal';
    if(marca) tipo = marca.tipo;
    else if(viaje && viaje.activo) tipo = viaje.tipo === 'reunion' ? 'reunion' : 'viaje';

    let comentario = '';
    if(tipo === 'festivo') comentario = marca.nombre ? `Festivo: ${marca.nombre}` : 'Festivo';
    else if(tipo === 'vacaciones') comentario = 'Vacaciones';
    else if(tipo === 'compensacion') comentario = 'Compensación de horas';
    else if(tipo === 'viaje') comentario = [viaje.lugar, viaje.cliente].filter(Boolean).join(' · ') || 'Viaje';
    else if(tipo === 'reunion') comentario = viaje.cliente || 'Reunión';
    else comentario = jornadasDia.map(j => j.observaciones).filter(Boolean).join(' · ');

    filas.push({
      fecha, tipo,
      horaInicio: jornadasDia.map(j => fmtTimeHM(j.entrada)).join(', '),
      horaFin: jornadasDia.map(j => j.salida ? fmtTimeHM(j.salida) : '(abierto)').join(', '),
      horasEfectivas: calc ? fmtHM(calc.efectivoTotal) : '',
      horasExtra: calc && calc.extra > 0 ? fmtHM(calc.extra) : '',
      horasCompensadas: tipo === 'compensacion' ? fmtHM((Number(marca.horas)||0) * 3600000) : '',
      comentario
    });
  }
  return filas;
}
// Meses "disponibles" para el informe: solo los que tienen algún dato
// registrado (fichaje, viaje, marca de calendario o "sin comida"), para no
// ofrecer meses vacíos. El mes en curso se incluye siempre que tenga algo,
// aunque sea un único día.
function mesesDisponiblesInforme(){
  const hoy = new Date();
  const claves = new Set([
    ...DATA.jornadas.map(j => j.fecha),
    ...Object.keys(DATA.calendarioLaboral),
    ...Object.keys(DATA.viajes),
    ...Object.keys(DATA.sinComida)
  ].filter(Boolean).map(f => f.slice(0, 7)));

  const claveActual = `${hoy.getFullYear()}-${pad2(hoy.getMonth()+1)}`;

  const meses = [...claves].filter(clave => clave <= claveActual).map(clave => {
    const [anioStr, mesStr] = clave.split('-');
    return { anio: Number(anioStr), mesIdx: Number(mesStr)-1, clave, esActual: clave === claveActual };
  }).sort((a,b) => b.clave.localeCompare(a.clave)); // el más reciente primero
  return meses;
}

// El modal muestra primero un selector de año (chips) y debajo solo los meses
// de ese año, para no acabar con una lista larga y con scroll al acumular
// varios años de datos. La selección de meses se guarda en UI.informeMensual
// .seleccionados (no en el DOM) precisamente para no perderla al cambiar de
// año. mesesDisponiblesInforme() ya solo devuelve los meses con algún dato
// registrado, así que nunca aparecen meses (ni años) vacíos.

    `);

  }

  if(!UI.informeMensual) UI.informeMensual = { anio: anios[0], seleccionados: new Set() };

      : '';
    const checked = UI.informeMensual.seleccionados.has(m.clave) ? 'checked' : '';
    return `
    <label class="mes-card">
      <input type="checkbox" class="informe-mes-chk" value="${m.clave}" ${checked}>
      <span class="mes-card-nombre">${MONTH_NAMES[m.mesIdx]}${m.esActual ? ' · en curso' : ''}</span>
      ${badge}

  }).join('');

  openModal(`

    <p style="color:var(--muted);font-size:13px;margin-bottom:12px;">Elige uno o varios meses: viaje en verde, reunión en lila, vacaciones en azul, festivo en amarillo y compensación en naranja. Si eliges varios, el Excel llevará una tabla separada por cada mes. El mes en curso se descarga marcado como incompleto (solo hasta hoy).</p>
    <p style="color:var(--muted);font-size:12px;margin-bottom:8px;">Toca un año para ver sus meses. Vuelve a tocar el año activo para marcar (o desmarcar) todos sus meses.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">${aniosHtml}</div>
    <div class="informe-meses-grid">${mesesHtml || '<p style="color:var(--muted);font-size:13px;">No hay meses con datos en este año.</p>'}</div>
    <button class="btn btn-primary btn-lg" data-action="confirmar-informe-mensual">📊 Descargar seleccionados (<span id="informeMesSelCount">${UI.informeMensual.seleccionados.size}</span>)</button>

  const claves = UI.informeMensual ? [...UI.informeMensual.seleccionados] : [];

// Genera un único Excel con una tabla (hoja) por cada mes elegido, y anota
// cada mes como "ya descargado" (el mes en curso, como incompleto).
function generarInformesMensuales(claves){
  const nombreTrabajador = DATA.perfil ? DATA.perfil.nombre : '';
  const claveHoy = todayStr().slice(0, 7);
  const clavesOrdenadas = [...claves].sort();

  const datos = clavesOrdenadas.map(clave => {
    const [anioStr, mesStr] = clave.split('-');
    const anio = Number(anioStr), mesIdx = Number(mesStr) - 1;
    const mesIni = `${clave}-01`;
    const totalDias = new Date(anio, mesIdx+1, 0).getDate();
    const esActual = clave === claveHoy;
    const mesFin = esActual ? todayStr() : `${clave}-${pad2(totalDias)}`;
    const saldoInicio = bancoHorasSaldoMs(addDays(mesIni, -1));
    const saldoFin = bancoHorasSaldoMs(mesFin);
    const filas = construirFilasInformeMensual(anio, mesIdx);
    const mesLabel = `${MONTH_NAMES[mesIdx]} ${anio}` + (esActual ? ' (incompleto, hasta hoy)' : '');
    return { clave, anio, mesIdx, esActual, mesLabel, saldoInicio, filas, saldoFin };
  });

  const nombresHoja = nombresHojaUnicos(datos.map(d => `${MONTH_NAMES[d.mesIdx]} ${d.anio}`));
  const sheets = datos.map((d,i) => ({
    name: nombresHoja[i],
    sheetXml: buildSheetXmlInformeMensual(nombreTrabajador, d.mesLabel, d.saldoInicio, d.filas, d.saldoFin)
  }));
  const blob = buildXlsxPackageMultiSheet(sheets, buildStylesXmlInformeMensual());

  const sufijoNombre = nombreTrabajador ? '_' + nombreTrabajador.trim().replace(/\s+/g,'_').replace(/[^A-Za-z0-9_ñÑáéíóúÁÉÍÓÚ-]/g,'') : '';
  const sufijoMeses = clavesOrdenadas.length === 1 ? clavesOrdenadas[0].replace('-','_') : `${clavesOrdenadas[0].replace('-','_')}_a_${clavesOrdenadas[clavesOrdenadas.length-1].replace('-','_')}`;
  descargarBlob(blob, `informe_mensual${sufijoNombre}_${sufijoMeses}.xlsx`, 'Informe mensual exportado');

  datos.forEach(d => { DATA.informesDescargados[d.clave] = { fecha: Date.now(), incompleto: d.esActual }; });
  save();
  if(UI.tab === 'resumen') renderResumen();
}

/* ---------------------------------------------------------------------
 * Lectura de un .xlsx (solo perfil directivo, pestaña "Equipo")
 * Solo sabe leer archivos generados por esta misma app (ZIP sin
 * compresión / método STORE). Si el archivo se abrió y volvió a guardar
 * con Excel/LibreOffice, estos recomprimen con DEFLATE y no se podrá
 * leer: se avisa claramente en vez de fallar en silencio.
 * ------------------------------------------------------------------- */
// Recorre una sola vez el directorio central del zip y devuelve, para cada
// entrada, su nombre y una función para extraer sus bytes sin comprimir
// (solo soporta STORE, como genera esta misma app).
function listarEntradasZip(bytes){
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const len = bytes.length;
  let eocd = -1;
  const limite = Math.max(0, len - 65557);
  for(let i = len - 22; i >= limite; i--){
    if(view.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('No es un archivo .xlsx válido.');
  const numRegistros = view.getUint16(eocd + 10, true);
  let ptr = view.getUint32(eocd + 16, true);
  const entradas = [];
  for(let i = 0; i < numRegistros; i++){
    if(view.getUint32(ptr, true) !== 0x02014b50) throw new Error('Estructura del .xlsx inesperada.');
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const nombre = new TextDecoder().decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    entradas.push({ nombre, datos: () => {
      const lfMethod = view.getUint16(localOffset + 8, true);
      const lfNameLen = view.getUint16(localOffset + 26, true);
      const lfExtraLen = view.getUint16(localOffset + 28, true);
      if(lfMethod !== 0) throw new Error('Este Excel usa compresión no soportada (¿se guardó desde Excel/LibreOffice? Importa el archivo original descargado desde la app).');
      const dataStart = localOffset + 30 + lfNameLen + lfExtraLen;
      return bytes.subarray(dataStart, dataStart + compSize);
    }});
    ptr += 46 + nameLen + extraLen + commentLen;
  }
  return entradas;
}
function extraerEntradaZip(bytes, nombreBuscado){
  const entrada = listarEntradasZip(bytes).find(e => e.nombre === nombreBuscado);
  if(!entrada) throw new Error('El archivo no contiene los datos esperados (¿es un Excel exportado por esta app?).');
  return entrada.datos();
}
// Nombres de las hojas (xl/worksheets/sheetN.xml) presentes en el .xlsx, en
// orden numérico (1, 2, 3…): un informe puede llevar una hoja por mes.
function nombresHojasWorksheet(bytes){
  return listarEntradasZip(bytes)
    .map(e => e.nombre)
    .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
    .sort((a,b) => Number(a.match(/\d+/)[0]) - Number(b.match(/\d+/)[0]));
}
// Lectura "en bruto" de una hoja del .xlsx: array de filas, cada una como
// array de valores de celda en el orden en que aparecen en el XML. Como
// nuestro propio generador siempre escribe una celda por columna usada
// (incluso vacía) y omite del todo las filas separadoras en blanco, esta
// lectura posicional reconstruye exactamente la estructura del informe.
function leerFilasCrudasDeHoja(bytes, nombreHoja){
  const xmlBytes = extraerEntradaZip(bytes, nombreHoja);
  const xml = new TextDecoder('utf-8').decode(xmlBytes);
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if(doc.querySelector('parsererror')) throw new Error('No se pudo leer el contenido del Excel.');
  return Array.from(doc.getElementsByTagName('row')).map(rowEl =>
    Array.from(rowEl.getElementsByTagName('c')).map(c => {
      if(c.getAttribute('t') === 'inlineStr'){
        const tEl = c.getElementsByTagName('t')[0];
        return tEl ? tEl.textContent : '';
      }
      const vEl = c.getElementsByTagName('v')[0];
      if(!vEl) return '';
      const num = Number(vEl.textContent);
      return isNaN(num) ? vEl.textContent : num;
    })
  );
}
function parseXlsxRows(arrayBuffer){
  const filas = leerFilasCrudasDeHoja(new Uint8Array(arrayBuffer), 'xl/worksheets/sheet1.xml');
  if(!filas.length) throw new Error('El Excel está vacío.');
  return { headers: filas[0].map(h => String(h).trim()), rows: filas.slice(1) };
}

/*
 * Lee un "Informe mensual" (el .xlsx coloreado que cada trabajador descarga
 * desde Resumen) reconstruyendo su estructura fija: nombre, mes, saldo de
 * inicio, cabecera de columnas, filas día a día (con su tipo de día) y saldo
 * final. No sirve para leer el exportador genérico "Exportar a Excel/CSV".
 */
function parseHojaInformeMensual(filas){
  if(filas.length < 5) throw new Error('El archivo no tiene el formato de un informe mensual.');
  const nombre = String(filas[0][0] || '').trim();
  const mesLabel = String(filas[1][0] || '').replace(/^Mes:\s*/, '').trim();
  const saldoInicioMs = parseHMTexto(String(filas[2][0] || '').replace(/^Horas (?:extra )?acumuladas a inicio de mes:\s*/, ''));

  const headerRow = (filas[3] || []).map(h => String(h).trim());
  const colIdx = nombreCol => headerRow.indexOf(nombreCol);
  const cFecha = colIdx('Fecha'), cIni = colIdx('Hora inicio'), cFin = colIdx('Hora fin'),
        cEfec = colIdx('Horas efectivas'), cExtra = colIdx('Horas extra'), cComp = colIdx('Horas compensadas'),
        cCom = colIdx('Comentario'), cTipo = colIdx('Tipo');
  if(cFecha < 0 || cTipo < 0){
    throw new Error('El archivo no tiene el formato esperado. Importa el "Informe mensual" descargado desde la pestaña Resumen.');
  }

  const dataRows = [];
  let saldoFinMs = 0;
  for(let i = 4; i < filas.length; i++){
    const fila = filas[i];
    const primera = String((fila && fila[0]) || '');
    if(/^Horas extra acumuladas/.test(primera)){
      saldoFinMs = parseHMTexto(primera.replace(/^Horas extra acumuladas después de este mes:\s*/, ''));
      break;
    }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(primera)) continue; // fila inesperada: se ignora
    const tipoLabel = String(fila[cTipo] ?? '').trim();
    dataRows.push({
      fecha: primera,
      tipo: INFORME_MENSUAL_TIPO_DESDE_LABEL[tipoLabel] || 'normal',
      horaInicio: String(fila[cIni] ?? ''),
      horaFin: String(fila[cFin] ?? ''),
      horasEfectivas: String(fila[cEfec] ?? ''),
      horasExtra: String(fila[cExtra] ?? ''),
      horasCompensadas: String(fila[cComp] ?? ''),
      comentario: String(fila[cCom] ?? '')
    });
  }
  if(!dataRows.length) throw new Error('El informe no contiene ningún día.');
  return { nombre, mesLabel, saldoInicioMs, saldoFinMs, filas: dataRows };
}
// Un mismo archivo puede traer un solo mes (una hoja) o varios (p.ej. "todo
// el año", una hoja por mes, como genera esta misma app al seleccionar
// varios meses de golpe). Se parsean todas las hojas y se ignoran, sin
// abortar la importación entera, las que no tengan formato de informe
// mensual (por si el archivo trajera alguna hoja ajena).
function parseInformesMensualesXlsx(arrayBuffer){
  const bytes = new Uint8Array(arrayBuffer);
  const nombresHojas = nombresHojasWorksheet(bytes);
  if(!nombresHojas.length) throw new Error('El archivo no contiene ninguna hoja de cálculo.');
  const informes = [];
  let hojasIgnoradas = 0;
  nombresHojas.forEach(nombreHoja => {
    try{
      informes.push(parseHojaInformeMensual(leerFilasCrudasDeHoja(bytes, nombreHoja)));
    }catch(e){
      hojasIgnoradas++;
    }
  });
  if(!informes.length) throw new Error('El archivo no tiene el formato de un informe mensual. Importa el "Informe mensual" descargado desde la pestaña Resumen.');
  return { informes, hojasIgnoradas };
}

let _pendienteImportEquipo = null;
async function importarExcelEquipo(file){
  try{
    const buf = await file.arrayBuffer();
    const { informes, hojasIgnoradas } = parseInformesMensualesXlsx(buf);
    _pendienteImportEquipo = { informes, archivoNombre: file.name };
    const resumenMeses = informes.length === 1
      ? `${informes[0].mesLabel || ''} · ${informes[0].filas.length} días`
      : `${informes.length} meses: ${informes.map(i => i.mesLabel || '?').join(', ')}`;
    const avisoIgnoradas = hojasIgnoradas
      ? `<p style="font-size:12px;color:var(--muted);margin-bottom:10px;">⚠️ ${hojasIgnoradas} hoja(s) del archivo no tenían formato de informe mensual y se han ignorado.</p>`
      : '';
    openModal(`
      <div class="modal-head"><h3>Importar informe mensual</h3><button class="modal-close" data-action="cerrar-modal">✕</button></div>
      <div class="field"><label>Nombre del trabajador</label><input type="text" id="impNombreTrabajador" value="${esc(informes[0].nombre)}" placeholder="Nombre y apellidos"></div>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px;">${esc(resumenMeses)} · «${esc(file.name)}»</p>
      ${avisoIgnoradas}
      <button class="btn btn-primary btn-lg" data-action="confirmar-importar-equipo">Guardar informe${informes.length > 1 ? 's' : ''}</button>
    `, {onOpen: () => document.getElementById('impNombreTrabajador').focus()});
  }catch(e){
    toast('No se pudo importar: ' + e.message);
  }
}
async function confirmarImportarEquipo(){
  const nombre = document.getElementById('impNombreTrabajador').value.trim();
  if(!nombre){ toast('Escribe el nombre del trabajador.'); return; }
  const { informes, archivoNombre } = _pendienteImportEquipo;

  // Cada hoja del archivo (un mes) se procesa por separado: así, un informe
  // de "todo el año" con una hoja por mes sustituye exactamente los meses
  // que ya tuviéramos de ese trabajador (por clave año-mes) y añade el
  // resto como nuevos, sin duplicar ni sumar dos veces ningún mes.
  const bloques = informes.map(informe => {
    let horasExtraMs = 0, horasCompensadasMs = 0, horasEfectivasMs = 0, diasConFichaje = 0;
    informe.filas.forEach(f => {
      horasExtraMs += parseHMTexto(f.horasExtra);
      horasCompensadasMs += parseHMTexto(f.horasCompensadas);
      horasEfectivasMs += parseHMTexto(f.horasEfectivas);
      if(f.horaInicio) diasConFichaje++;
    });
    const fechas = informe.filas.map(f => f.fecha).sort();
    const fechaMin = fechas[0], fechaMax = fechas[fechas.length-1];
    return {
      claveMes: fechaMin ? fechaMin.slice(0, 7) : '',
      mesLabel: informe.mesLabel,
      datos: {
        nombreTrabajador: nombre, archivoNombre, fechaImportacion: Date.now(),
        mesLabel: informe.mesLabel,
        saldoInicioMs: informe.saldoInicioMs, saldoFinMs: informe.saldoFinMs,
        fechaMin, fechaMax,
        filas: informe.filas,
        totales: { horasExtraMs, horasCompensadasMs, horasEfectivasMs, dias: diasConFichaje, totalDiasMes: informe.filas.length }
      }
    };
  });

  const existentesPorClave = new Map();
  bloques.forEach(b => {
    const existente = DATA.equipo.find(i =>
      i.nombreTrabajador.trim().toLowerCase() === nombre.toLowerCase() &&
      (i.fechaMin || '').slice(0, 7) === b.claveMes
    );
    if(existente) existentesPorClave.set(b.claveMes, existente);
  });

  if(existentesPorClave.size){
    // Si el archivo nuevo trae MENOS días con fichaje que el informe que ya
    // teníamos de ese mes (p.ej. se reimporta por error una versión vieja o
    // incompleta encima de una ya completa), se avisa explícitamente para no
    // perder datos sin darse cuenta; sustituir un mes incompleto por su
    // versión completa (con más días) no lleva aviso, es el caso normal.
    const meses = bloques.filter(b => existentesPorClave.has(b.claveMes)).map(b => {
      const existente = existentesPorClave.get(b.claveMes);
      const diasNuevo = b.datos.totales.dias, diasViejo = existente.totales.dias;
      const etiqueta = b.mesLabel || b.claveMes;
      return diasNuevo < diasViejo
        ? `${etiqueta} (⚠️ el que ya tienes tiene más días con fichaje: ${diasViejo} frente a ${diasNuevo})`
        : etiqueta;
    }).join(', ');
    const ok = await confirmDialog(
      bloques.length === 1
        ? `Ya habías importado un informe de ${nombre} para ${meses}. ¿Quieres sustituirlo por este archivo nuevo?`
        : `Ya habías importado informes de ${nombre} para: ${meses}. Se sustituirán por los de este archivo${bloques.length > existentesPorClave.size ? ' (el resto de meses se añadirán nuevos)' : ''}. ¿Continuar?`,
      'Sustituir', true);
    if(!ok) return;
  }

  bloques.forEach(b => {
    const existente = existentesPorClave.get(b.claveMes);
    if(existente) Object.assign(existente, b.datos);
    else DATA.equipo.push({ id: uid(), ...b.datos });
  });

  save();
  closeModal();
  toast(bloques.length === 1
    ? (existentesPorClave.size ? `Informe de ${nombre} sustituido.` : `Informe de ${nombre} importado (${bloques[0].mesLabel || bloques[0].datos.filas.length + ' días'}).`)
    : `${bloques.length} meses de ${nombre} importados${existentesPorClave.size ? ` (${existentesPorClave.size} sustituidos)` : ''}.`);
  renderEquipo();
}

function agruparEquipo(){
  const grupos = {};
  DATA.equipo.forEach(inf => {
    const key = inf.nombreTrabajador.trim().toLowerCase();
    if(!grupos[key]) grupos[key] = { nombre: inf.nombreTrabajador, informes: [] };
    grupos[key].informes.push(inf);
  });
  return Object.values(grupos).sort((a,b) => a.nombre.localeCompare(b.nombre));
}

// Tabla con el estado global de horas extra de cada trabajador (nº de
// informes, días fichados, horas efectivas/extra/compensadas y saldo
// pendiente). La usan tanto el "Resumen del equipo" descargable por separado
// como la hoja de resumen del Excel combinado.
function filasResumenEquipo(){
  const trabajadores = agruparEquipo();
  const headers = ['Trabajador','Nº de informes','Días con fichaje','Horas efectivas','Horas extra generadas','Horas compensadas','Saldo pendiente','Periodo más antiguo','Periodo más reciente'];
  const rows = trabajadores.map(w => {
    const totalEfectivo = w.informes.reduce((s,i)=>s+(i.totales.horasEfectivasMs||0),0);
    const totalExtra = w.informes.reduce((s,i)=>s+(i.totales.horasExtraMs||0),0);
    const totalCompensado = w.informes.reduce((s,i)=>s+(i.totales.horasCompensadasMs||0),0);
    const totalDias = w.informes.reduce((s,i)=>s+(i.totales.dias||0),0);
    const fechas = w.informes.flatMap(i => [i.fechaMin, i.fechaMax]).filter(Boolean).sort();
    return [w.nombre, w.informes.length, totalDias, hoursDecimal(totalEfectivo), hoursDecimal(totalExtra), hoursDecimal(totalCompensado), hoursDecimal(totalExtra-totalCompensado), fechas[0]||'', fechas[fechas.length-1]||''];
  });
  return { headers, rows };
}
function exportarResumenEquipo(){
  const { headers, rows } = filasResumenEquipo();
  const blob = buildXlsxBlob('Equipo', headers, rows);
  descargarBlob(blob, `resumen_equipo_${todayStr()}.xlsx`, 'Resumen del equipo exportado');
}
// Arma el Excel combinado del equipo: una primera hoja de "Resumen" con el
// estado global de horas extra de todos los trabajadores, seguida de una hoja
// por trabajador con TODOS sus meses apilados uno debajo de otro (mismo
// formato que el informe individual), listo para reenviar a quien lo necesite.
function exportarTodosInformesEquipo(){
  if(!DATA.equipo.length){ toast('No hay informes importados.'); return; }
  const empleados = agruparEquipo(); // ya viene ordenado alfabéticamente por nombre

  const nombresHoja = nombresHojaUnicos(['Resumen', ...empleados.map(e => e.nombre)]);
  const { headers: resumenHeaders, rows: resumenRows } = filasResumenEquipo();
  const sheets = [
    { name: nombresHoja[0], sheetXml: buildSheetXml(resumenHeaders, resumenRows) },
    ...empleados.map((emp, i) => {
      const meses = emp.informes.slice()
        .sort((a,b) => (a.fechaMin||'').localeCompare(b.fechaMin||''))
        .map(inf => ({
          mesLabel: inf.mesLabel || (inf.fechaMin ? `${fmtDateShort(inf.fechaMin)} – ${fmtDateShort(inf.fechaMax)}` : inf.archivoNombre),
          saldoInicioMs: inf.saldoInicioMs||0,
          saldoFinMs: inf.saldoFinMs||0,
          // Los informes con el formato antiguo (previo a esta función) no
          // tienen estos campos por día: se normalizan para no dejar celdas
          // con "undefined".
          filas: (inf.filas||[]).map(f => ({
            fecha: f.fecha||'', tipo: f.tipo||'normal',
            horaInicio: f.horaInicio||'', horaFin: f.horaFin||'',
            horasEfectivas: f.horasEfectivas||'', horasExtra: f.horasExtra||'',
            horasCompensadas: f.horasCompensadas||'', comentario: f.comentario||''
          }))
        }));
      return { name: nombresHoja[i+1], sheetXml: buildSheetXmlInformeMensualEmpleado(emp.nombre, meses) };
    })
  ];
  const blob = buildXlsxPackageMultiSheet(sheets, buildStylesXmlInformeMensual());
  descargarBlob(blob, `informes_equipo_${todayStr()}.xlsx`, 'Informes del equipo exportados en un solo archivo');
}

function exportarBackup(){
  const json = JSON.stringify(DATA, null, 2);
  descargarBlob(new Blob([json], {type:'application/json'}), `backup_fichaje_${todayStr()}.json`, 'Copia de seguridad exportada');
}
function importarBackupSeleccionado(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast('El archivo no es un JSON válido.'); return; }
    if(!parsed || !Array.isArray(parsed.jornadas) || !parsed.config){
      toast('El archivo no tiene el formato esperado.'); return;
    }
    const ok = await confirmDialog('Vas a sobrescribir TODOS los datos actuales con los de esta copia de seguridad. ¿Continuar?', 'Restaurar', true);
    if(!ok) return;
    const def = defaultData();
    const diasGuardados = parsed.config.dias || {};
    const diasFusionados = {};
    for(const dow of Object.keys(def.config.dias)){
      diasFusionados[dow] = Object.assign({}, def.config.dias[dow], diasGuardados[dow] || {});
    }
    const idsValidos = COLUMNAS_EXPORT.map(c => c.id);
    const columnasGuardadas = Array.isArray(parsed.config.exportColumnas) ? parsed.config.exportColumnas.filter(id => idsValidos.includes(id)) : [];
    // Las copias de seguridad antiguas (con "trayectos") se aceptan igualmente;
    // esos viajes en coche ya no existen como función y se descartan.
    DATA = {
      version: 1,
      config: Object.assign({}, def.config, parsed.config, {dias: diasFusionados, exportColumnas: columnasGuardadas.length ? columnasGuardadas : idsValidos}),
      jornadas: parsed.jornadas,
      perfil: parsed.perfil || null,
      sesionAbierta: !!parsed.sesionAbierta,
      equipo: Array.isArray(parsed.equipo) ? parsed.equipo : [],
      calendarioLaboral: (parsed.calendarioLaboral && typeof parsed.calendarioLaboral === 'object') ? parsed.calendarioLaboral : {},
      viajes: (parsed.viajes && typeof parsed.viajes === 'object') ? parsed.viajes : {},
      sinComida: (parsed.sinComida && typeof parsed.sinComida === 'object') ? parsed.sinComida : {},
      comidaOverride: (parsed.comidaOverride && typeof parsed.comidaOverride === 'object') ? parsed.comidaOverride : {},
      informesDescargados: (parsed.informesDescargados && typeof parsed.informesDescargados === 'object') ? parsed.informesDescargados : {}
    };
    save();
    toast('Copia de seguridad restaurada');
    aplicarTema();
    renderAll();
  };
  reader.readAsText(file);
}

/* ----------------------------- Acceso directo / icono ------------------- */
/*
 * Genera un icono de app (canvas → PNG) más nítido que el SVG estático y lo
 * declara como apple-touch-icon. El manifest ("manifest.json", con sus
 * icons y shortcuts) se sirve como archivo real y NO se toca aquí: si se
 * sobrescribiera con uno generado en memoria, los accesos rápidos de
 * "Fichar entrada/salida" del icono dejarían de funcionar.
 */
function configurarAccesoDirecto(){
  try{
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#910048';
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(0,0,512,512,112); ctx.fill(); }
    else { ctx.fillRect(0,0,512,512); }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 34; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(256,266,150,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(256,266); ctx.lineTo(256,158); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(256,266); ctx.lineTo(332,306); ctx.stroke();
    const iconUrl = canvas.toDataURL('image/png');

    let touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
    if(!touchIcon){ touchIcon = document.createElement('link'); touchIcon.rel = 'apple-touch-icon'; document.head.appendChild(touchIcon); }
    touchIcon.href = iconUrl;
  }catch(e){ console.error('No se pudo generar el icono de acceso directo.', e); }
}

async function crearPerfil(){
  const nombre = document.getElementById('authNombre').value.trim();
  const pass = document.getElementById('authPass').value;

  if(!nombre){ mostrarErrorAuth('Escribe tu nombre.'); return; }
  if(pass.length < 4){ mostrarErrorAuth('La contraseña debe tener al menos 4 caracteres.'); return; }
  if(pass !== pass2){ mostrarErrorAuth('Las contraseñas no coinciden.'); return; }

  arrancarAppPrincipal();

  arrancarAppPrincipal();

/*
 * Fichaje directo desde los accesos rápidos del icono de la app
 * (manifest "shortcuts" → ?accion=entrada / ?accion=salida). Reutiliza las
 * mismas funciones y validaciones que los botones normales de la pestaña Hoy.
 */
function procesarAccesoDirecto(){
  const params = new URLSearchParams(window.location.search);
  const accion = params.get('accion');
  if(accion === 'entrada') accionFicharEntrada();
  else if(accion === 'salida') accionFicharSalida();
  if(accion){
    const url = new URL(window.location.href);
    url.searchParams.delete('accion');
    window.history.replaceState({}, '', url);
  }
}

// Recuerda la última pestaña visitada para que un refresco de página no
// vuelva siempre a "Hoy" (se guarda aparte de DATA: es solo estado de UI).
const TABS_VALIDAS = ['hoy','historico','resumen','equipo','ajustes'];
const TAB_STORAGE_KEY = 'controlHorario_ultimaPestana_v1';
function obtenerUltimaPestana(){
  try{
    const t = localStorage.getItem(TAB_STORAGE_KEY);
    return TABS_VALIDAS.includes(t) ? t : 'hoy';
  }catch(e){ return 'hoy'; }
}
function guardarUltimaPestana(tab){
  try{ localStorage.setItem(TAB_STORAGE_KEY, tab); }catch(e){}
}
function setTab(tab){
  UI.tab = tab;
  guardarUltimaPestana(tab);
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab));
  document.querySelectorAll('.tabbar-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTabContent(tab);
  window.scrollTo(0,0);
}
function renderTabContent(tab){
  if(tab === 'hoy') renderHoy();
  else if(tab === 'historico') renderHistorico();
  else if(tab === 'resumen') renderResumen();
  else if(tab === 'equipo') renderEquipo();
  else if(tab === 'ajustes') renderAjustes();
}

  renderBanner();

    case 'toggle-aviso-entrada':
      DATA.config.avisoEntradaActivo = !DATA.config.avisoEntradaActivo;
      save(); renderAll();
      break;

    case 'filtro-historico':
      UI.historico.filtro = d.filtro;
      renderHistorico();
      break;
    case 'toggle-solo-viaje':
      UI.historico.soloViaje = !UI.historico.soloViaje;
      renderHistorico();
      break;
    case 'ver-dia': verDia(d.fecha); break;
    case 'crear-jornada-manual': crearJornadaManual(d.fecha); break;
    case 'agregar-tramo-dia': agregarTramoDia(d.fecha); break;
    case 'guardar-jornada-editada': guardarJornadaEditada(d.id); break;
    case 'eliminar-jornada': await eliminarJornada(d.id); break;
    case 'agregar-intervalo': agregarIntervalo(d.tipo, d.jid); break;
    case 'editar-intervalo': editarIntervalo(d.tipo, d.jid, d.iid); break;
    case 'guardar-intervalo-editado': guardarIntervaloEditado(d.tipo, d.jid, d.iid); break;
    case 'eliminar-intervalo': await eliminarIntervalo(d.tipo, d.jid, d.iid); break;

    case 'resumen-semana-nav':
      UI.resumen.semanaRef = addDays(UI.resumen.semanaRef, Number(d.dir) * 7);
      renderResumen();
      break;
    case 'resumen-mes-nav': {
      const ref = parseDateLocal(UI.resumen.mesResumenRef);
      const nuevo = new Date(ref.getFullYear(), ref.getMonth()+Number(d.dir), 1);
      UI.resumen.mesResumenRef = todayStr(nuevo);
      renderResumen();
      break;
    }

    case 'cal-mes': {
      const ref = parseDateLocal(UI.resumen.mesRef);
      const nuevo = new Date(ref.getFullYear(), ref.getMonth()+Number(d.dir), 1);
      UI.resumen.mesRef = todayStr(nuevo);
      renderResumen();
      break;
    }
    case 'abrir-dia-calendario': abrirDiaCalendario(d.fecha); break;
    case 'marcar-dia': {
      const marcaActual = diaCalendarioLaboral(d.fecha);
      if(d.tipo === 'normal') quitarMarcaCalendarioLaboral(d.fecha);
      // Si ya estaba en ese mismo tipo, no se vuelve a marcar: evita perder
      // un nombre de festivo o unas horas de compensación editados a mano.
      else if(!marcaActual || marcaActual.tipo !== d.tipo) marcarDiaCalendarioLaboral(d.fecha, d.tipo);
      renderAll();
      abrirDiaCalendario(d.fecha);
      break;
    }
    case 'cargar-festivos-navarra': await cargarFestivosNavarra(); break;
    case 'exportar-calendario-pdf': exportarCalendarioPDF(); break;
    case 'abrir-exportar-excel': abrirModalExportar('xlsx'); break;
    case 'abrir-exportar-csv': abrirModalExportar('csv'); break;
    case 'confirmar-exportar': confirmarExportar(d.tipo); break;
    case 'abrir-informe-mensual': UI.informeMensual = null; abrirModalInformeMensual(); break;
    case 'informe-mes-anio': {
      const anio = Number(d.anio);
      if(UI.informeMensual.anio === anio){
        // Ya estábamos en este año: un segundo clic en el mismo chip marca
        // (o desmarca, si ya estaban todos) todos sus meses de golpe.
        const mesesAnio = mesesDisponiblesInforme().filter(m => m.anio === anio);
        const todosMarcados = mesesAnio.every(m => UI.informeMensual.seleccionados.has(m.clave));
        mesesAnio.forEach(m => {
          if(todosMarcados) UI.informeMensual.seleccionados.delete(m.clave);
          else UI.informeMensual.seleccionados.add(m.clave);
        });
      } else {
        UI.informeMensual.anio = anio;
      }
      abrirModalInformeMensual();
      break;
    }
    case 'confirmar-informe-mensual': confirmarInformeMensual(); break;
    case 'export-cols-todos':
      document.querySelectorAll('.export-col-chk').forEach(chk => chk.checked = true);
      break;
    case 'export-cols-ninguno':
      document.querySelectorAll('.export-col-chk').forEach(chk => chk.checked = false);
      break;

    case 'toggle-dia-activo': break; // manejado en 'change'
    case 'toggle-dia-comida':
      DATA.config.dias[d.dow].comida = DATA.config.dias[d.dow].comida === false;
      save(); renderAll();
      break;
    case 'set-modo':
      DATA.config[d.campo] = d.valor;
      save(); renderAll();
      break;
    case 'set-tema':
      DATA.config.tema = d.valor;
      save(); aplicarTema(); renderAll();
      break;

    case 'exportar-backup': exportarBackup(); break;
    case 'importar-backup': document.getElementById('fileImportBackup').click(); break;
    case 'instalar-app': await instalarApp(); break;

    case 'elegir-rol': _rolElegido = d.rol; renderAuthScreen(); break;
    case 'crear-perfil': await crearPerfil(); break;
    case 'iniciar-sesion': await iniciarSesion(); break;
    case 'pedir-reset-perfil': await pedirResetPerfil(); break;
    case 'cerrar-sesion': cerrarSesion(); break;

    case 'importar-excel-equipo': document.getElementById('fileImportExcelEquipo').click(); break;

    case 'exportar-resumen-equipo': exportarResumenEquipo(); break;
    case 'exportar-informes-equipo-combinado': exportarTodosInformesEquipo(); break;

    case 'cerrar-modal': closeModal(); break;
  }
});

document.getElementById('tabbar').addEventListener('click', (e) => {
  const b = e.target.closest('.tabbar-item');
  if(b) setTab(b.dataset.tab);
});
document.getElementById('themeQuickToggle').addEventListener('click', () => {
  const orden = ['claro','oscuro','auto'];
  const i = orden.indexOf(DATA.config.tema);
  DATA.config.tema = orden[(i+1)%orden.length];
  save(); aplicarTema();
  toast('Tema: ' + DATA.config.tema);
  if(UI.tab === 'ajustes') renderAjustes();
});

/* ----------------------------- Arranque --------------------------------- */
function init(){
  configurarAccesoDirecto();
  // Evita fichajes de entrada duplicados si hay más de uno abierto por datos corruptos:
  // conserva sólo el primero abierto encontrado (no debería ocurrir con el flujo normal).
  const abiertas = DATA.jornadas.filter(j => j.salida == null);
  if(abiertas.length > 1){
    for(let i=1;i<abiertas.length;i++) abiertas[i].salida = abiertas[i].entrada;
    save();
  }
  aplicarTema();
  if(sesionActiva()){
    arrancarAppPrincipal();
    procesarAccesoDirecto();
  } else {
    document.getElementById('authScreen').classList.remove('hidden');
    renderAuthScreen();
  }
  setInterval(() => {
    if(!sesionActiva()) return;
    tickLive();
    document.getElementById('headerClock').textContent = fmtDateHuman(todayStr()) + ' · ' + fmtTimeHM(Date.now());
  }, 1000);
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
