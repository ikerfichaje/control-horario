        <button data-action="set-tema" data-valor="oscuro" class="${c.tema==='oscuro'?'active':''}">🌙 Oscuro</button>
        <button data-action="set-tema" data-valor="auto" class="${c.tema==='auto'?'active':''}">🔄 Automático</button>
      </div>
    </div>

    <div class="card">
      <h2>Copia de seguridad</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Todos tus datos están guardados únicamente en este dispositivo (localStorage). Exporta una copia periódicamente por seguridad.</p>
      <div class="btn-row">
        <button class="btn btn-outline" data-action="exportar-backup">⬇ Exportar copia</button>
        <button class="btn btn-outline" data-action="importar-backup">⬆ Importar copia</button>
      </div>
    </div>

    <div class="card">
      <h2>Privacidad</h2>
      <p style="font-size:13px;color:var(--muted);line-height:1.6;">
        Ningún dato (horarios, trayectos, ubicaciones, histórico) sale de este dispositivo, salvo que tú mismo abras
        voluntariamente Google Maps desde un trayecto. La aplicación no incluye analítica ni publicidad.
      </p>
    </div>

    <button class="btn btn-primary btn-lg" data-action="guardar-ajustes" style="margin-bottom:20px;">Guardar configuración</button>
  `;
}
function guardarAjustesForm(){
  const c = DATA.config;
  const elDescansoMin = document.getElementById('cfgDescansoMin');
  if(elDescansoMin) c.descansoMin = Number(elDescansoMin.value) || 0;
  const elComidaMin = document.getElementById('cfgComidaMin');
  if(elComidaMin) c.comidaMin = Number(elComidaMin.value) || 0;
  const elComidaInicio = document.getElementById('cfgComidaInicio');
  const elComidaFin = document.getElementById('cfgComidaFin');
  if(elComidaInicio) c.comidaInicio = elComidaInicio.value || c.comidaInicio;
  if(elComidaFin) c.comidaFin = elComidaFin.value || c.comidaFin;
  document.querySelectorAll('[data-field="horas"]').forEach(inp => {
    c.dias[inp.dataset.dow].horas = Math.max(0, Number(inp.value) || 0);
  });
  save();
  toast('Configuración guardada');
  renderAll();
}

/* ----------------------------- Backup --------------------------------- */
function exportarBackup(){
  const json = JSON.stringify(DATA, null, 2);
  descargarBlob(new Blob([json], {type:'application/json'}), `backup_fichaje_${todayStr()}.json`, 'Copia de seguridad exportada');
}
function importarBackupSeleccionado(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast('El archivo no es un JSON válido.'); return; }
    if(!parsed || !Array.isArray(parsed.jornadas) || !Array.isArray(parsed.trayectos) || !parsed.config){
      toast('El archivo no tiene el formato esperado.'); return;
    }
    const ok = await confirmDialog('Vas a sobrescribir TODOS los datos actuales con los de esta copia de seguridad. ¿Continuar?', 'Restaurar', true);
    if(!ok) return;
    const def = defaultData();
    const diasGuardados = parsed.config.dias || {};
    const diasFusionados = {};
    for(const dow of Object.keys(def.config.dias)){
      diasFusionados[dow] = Object.assign({}, def.config.dias[dow], diasGuardados[dow] || {});
    }
    DATA = {
      version: 1,
      config: Object.assign({}, def.config, parsed.config, {dias: diasFusionados}),
      jornadas: parsed.jornadas,
      trayectos: parsed.trayectos
    };
    save();
    toast('Copia de seguridad restaurada');
    aplicarTema();
    renderAll();
  };
  reader.readAsText(file);
}

/* ----------------------------- Acceso directo / icono ------------------- */
/*
 * Genera un icono de app (canvas → PNG) y lo declara como apple-touch-icon
 * y en un manifest embebido como data URI, para que "Añadir a pantalla de
 * inicio" muestre un icono propio en vez de una captura de la página. No
 * requiere ningún archivo externo: todo se genera dentro de este HTML.
 */
function configurarAccesoDirecto(){
  try{
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#2563eb';
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(0,0,512,512,112); ctx.fill(); }
    else { ctx.fillRect(0,0,512,512); }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 34; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(256,266,150,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(256,266); ctx.lineTo(256,158); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(256,266); ctx.lineTo(332,306); ctx.stroke();
    const iconUrl = canvas.toDataURL('image/png');

    let touchIcon = document.querySelector('link[rel="apple-touch-icon"]');
    if(!touchIcon){ touchIcon = document.createElement('link'); touchIcon.rel = 'apple-touch-icon'; document.head.appendChild(touchIcon); }
    touchIcon.href = iconUrl;

    const manifest = {
      name: 'Control Horario', short_name: 'Fichaje', start_url: '.', display: 'standalone',
      background_color: '#0f1115', theme_color: '#2563eb',
      icons: [{ src: iconUrl, sizes: '512x512', type: 'image/png' }]
    };
    const manifestB64 = btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
    let manifestLink = document.querySelector('link[rel="manifest"]');
    if(!manifestLink){ manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = 'data:application/manifest+json;base64,' + manifestB64;
  }catch(e){ console.error('No se pudo generar el icono de acceso directo.', e); }
}
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); _deferredInstallPrompt = e; });
async function instalarApp(){
  if(_deferredInstallPrompt){
    _deferredInstallPrompt.prompt();
    await _deferredInstallPrompt.userChoice;
    _deferredInstallPrompt = null;
  } else {
    mostrarInstruccionesInstalacion();
  }
}
function mostrarInstruccionesInstalacion(){
  openModal(`
    <div class="modal-head"><h3>Añadir a la pantalla de inicio</h3><button class="modal-close" data-action="cerrar-modal">✕</button></div>
    <div class="section-title">Android (Chrome)</div>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.6;">Toca el menú ⋮ (arriba a la derecha) y elige «Añadir a pantalla de inicio» o «Instalar aplicación».</p>
    <div class="section-title">iPhone (Safari)</div>
    <p style="font-size:13.5px;color:var(--muted);line-height:1.6;">Toca el icono de compartir (el cuadrado con la flecha hacia arriba, abajo en la barra) y elige «Añadir a pantalla de inicio».</p>
  `, {center:true});
}

/* ----------------------------- Tema ------------------------------------ */
function aplicarTema(){
  const tema = DATA.config.tema;
  let resolved = tema;
  if(tema === 'auto'){
    resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
  }
  document.documentElement.setAttribute('data-theme', resolved === 'oscuro' ? 'dark' : 'light');
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if(DATA.config.tema === 'auto') aplicarTema();
  });
}

/* ----------------------------- Pantalla de identificación ---------------- */
let _rolElegido = 'trabajador';
function renderAuthScreen(){
  const el = document.getElementById('authScreen');
  if(!DATA.perfil){
    el.innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="auth-logo">⏱</div>
        <h2>Crea tu perfil</h2>
        <div class="sub">Este dispositivo aún no tiene ningún perfil configurado.</div>
        <div id="authErrorBox"></div>
        <div class="role-pick">
          <div class="role-opt ${_rolElegido==='trabajador'?'active':''}" data-action="elegir-rol" data-rol="trabajador">
            <span class="ic">🧑‍🔧</span><b>Trabajador</b><small>Ficho mis horas</small>
          </div>
          <div class="role-opt ${_rolElegido==='directivo'?'active':''}" data-action="elegir-rol" data-rol="directivo">
            <span class="ic">🧑‍💼</span><b>Directivo</b><small>Reviso al equipo</small>
          </div>
        </div>
        <div class="field"><label>Tu nombre</label><input type="text" id="authNombre" placeholder="Ej. María López" autocomplete="name"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="authPass" placeholder="Mínimo 4 caracteres" autocomplete="new-password"></div>
        <div class="field"><label>Repite la contraseña</label><input type="password" id="authPass2" autocomplete="new-password"></div>
        <button class="btn btn-primary btn-lg" data-action="crear-perfil">Empezar</button>
        <p style="font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5;">La contraseña solo identifica este perfil en este dispositivo; no se envía a ningún sitio.</p>
      </div></div>`;
  } else {
    el.innerHTML = `
      <div class="auth-wrap"><div class="auth-card">
        <div class="auth-logo">⏱</div>
        <h2>Hola, ${esc(DATA.perfil.nombre)}</h2>
        <div class="sub">${DATA.perfil.rol==='directivo' ? 'Perfil directivo' : 'Perfil trabajador'} · introduce tu contraseña</div>
        <div id="authErrorBox"></div>
        <div class="field"><label>Contraseña</label><input type="password" id="authPassLogin" autocomplete="current-password"></div>
        <button class="btn btn-primary btn-lg" data-action="iniciar-sesion">Entrar</button>
        <div class="auth-switch"><a class="link" href="#" data-action="pedir-reset-perfil">¿No eres tú? Restablecer perfil de este dispositivo</a></div>
      </div></div>`;
    document.getElementById('authPassLogin')?.addEventListener('keydown', e => { if(e.key === 'Enter') iniciarSesion(); });
  }
}
function mostrarErrorAuth(msg){
  const box = document.getElementById('authErrorBox');
  if(box) box.innerHTML = `<div class="auth-error">${esc(msg)}</div>`;
}
async function crearPerfil(){
  const nombre = document.getElementById('authNombre').value.trim();
  const pass = document.getElementById('authPass').value;
  const pass2 = document.getElementById('authPass2').value;
  if(!nombre){ mostrarErrorAuth('Escribe tu nombre.'); return; }
  if(pass.length < 4){ mostrarErrorAuth('La contraseña debe tener al menos 4 caracteres.'); return; }
  if(pass !== pass2){ mostrarErrorAuth('Las contraseñas no coinciden.'); return; }
  const passHash = await hashPassword(pass);
  DATA.perfil = { nombre, passHash, rol: _rolElegido };
  DATA.sesionAbierta = true;
  save();
  arrancarAppPrincipal();
}
async function iniciarSesion(){
  const pass = document.getElementById('authPassLogin').value;
  const hash = await hashPassword(pass);
  if(hash !== DATA.perfil.passHash){ mostrarErrorAuth('Contraseña incorrecta.'); return; }
  DATA.sesionAbierta = true;
  save();
  arrancarAppPrincipal();
}
function cerrarSesion(){
  DATA.sesionAbierta = false;
  save();
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('tabbar').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  renderAuthScreen();
}
async function pedirResetPerfil(){
  const ok = await confirmDialog('Esto borra el nombre/contraseña de este dispositivo (tus fichajes NO se borran). Tendrás que crear el perfil de nuevo. ¿Continuar?', 'Restablecer', true);
  if(!ok) return;
  DATA.perfil = null;
  DATA.sesionAbierta = false;
  save();
  renderAuthScreen();
}
function arrancarAppPrincipal(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('tabbar').classList.remove('hidden');
  document.getElementById('tabbarEquipoBtn').classList.toggle('hidden', !esDirectivo());
  aplicarTema();
  setTab('hoy');
  renderAll();
}

/* ----------------------------- Navegación / render general -------------- */
function setTab(tab){
  UI.tab = tab;
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab));
  document.querySelectorAll('.tabbar-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderTabContent(tab);
  window.scrollTo(0,0);
}
function renderTabContent(tab){
  if(tab === 'hoy') renderHoy();
  else if(tab === 'historico') renderHistorico();
  else if(tab === 'trayectos') renderTrayectos();
  else if(tab === 'resumen') renderResumen();
  else if(tab === 'equipo') renderEquipo();
  else if(tab === 'ajustes') renderAjustes();
}
function renderAll(){
  renderBanner();
  renderTabContent(UI.tab);
  document.getElementById('headerClock').textContent = fmtDateHuman(todayStr()) + ' · ' + fmtTimeHM(Date.now());
}

/* ----------------------------- Delegación de eventos --------------------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action;
  const d = t.dataset;

  switch(a){
    case 'fichar-entrada': accionFicharEntrada(); break;
    case 'fichar-salida': accionFicharSalida(); break;
    case 'iniciar-descanso': accionIniciarDescanso(); break;
    case 'finalizar-descanso': accionFinalizarDescanso(); break;
    case 'iniciar-comida': accionIniciarComida(); break;
    case 'finalizar-comida': accionFinalizarComida(); break;

    case 'abrir-iniciar-trayecto': abrirFormularioTrayecto(); break;
    case 'confirmar-iniciar-trayecto': confirmarIniciarTrayecto(); break;
    case 'abrir-finalizar-trayecto': abrirFormularioFinalizarTrayecto(); break;
    case 'confirmar-finalizar-trayecto': confirmarFinalizarTrayecto(d.id); break;
    case 'usar-ubicacion': usarUbicacionActual(d.target); break;
    case 'abrir-maps': abrirEnGoogleMaps(d.id); break;
    case 'editar-trayecto': abrirFormEditarTrayecto(d.id); break;
    case 'guardar-trayecto-editado': guardarTrayectoEditado(d.id); break;
    case 'eliminar-trayecto': await eliminarTrayecto(d.id); break;
    case 'agregar-trayecto-dia': agregarTrayectoDia(d.fecha); break;

    case 'fichaje-abierto-cerrar-ahora': fichajeAbiertoCerrarAhora(d.id); break;
    case 'fichaje-abierto-manual': fichajeAbiertoManual(d.id); break;
    case 'confirmar-salida-manual-abierto': confirmarSalidaManualAbierto(d.id); break;
    case 'fichaje-abierto-continuar': UI.bannerDismissed = true; renderBanner(); break;

    case 'filtro-historico':
      UI.historico.filtro = d.filtro;
      renderHistorico();
      break;
    case 'ver-dia': verDia(d.fecha); break;
    case 'crear-jornada-manual': crearJornadaManual(d.fecha); break;
    case 'guardar-jornada-editada': guardarJornadaEditada(d.id); break;
    case 'eliminar-jornada': await eliminarJornada(d.id); break;
    case 'agregar-intervalo': agregarIntervalo(d.tipo, d.jid); break;
    case 'editar-intervalo': editarIntervalo(d.tipo, d.jid, d.iid); break;
    case 'guardar-intervalo-editado': guardarIntervaloEditado(d.tipo, d.jid, d.iid); break;
    case 'eliminar-intervalo': await eliminarIntervalo(d.tipo, d.jid, d.iid); break;

    case 'cal-mes': {
      const ref = parseDateLocal(UI.resumen.mesRef);
      const nuevo = new Date(ref.getFullYear(), ref.getMonth()+Number(d.dir), 1);
      UI.resumen.mesRef = todayStr(nuevo);
      renderResumen();
      break;
    }
    case 'abrir-exportar-excel': abrirModalExportar('xlsx'); break;
    case 'abrir-exportar-csv': abrirModalExportar('csv'); break;
    case 'confirmar-exportar': confirmarExportar(d.tipo); break;

    case 'toggle-dia-activo': break; // manejado en 'change'
    case 'toggle-dia-comida':
      DATA.config.dias[d.dow].comida = DATA.config.dias[d.dow].comida === false;
      save(); renderAjustes(); renderAll();
      break;
    case 'set-modo':
      DATA.config[d.campo] = d.valor;
      save(); renderAjustes(); renderAll();
      break;
    case 'toggle-trayecto-trabajo':
      DATA.config.trayectoComoTrabajo = !DATA.config.trayectoComoTrabajo;
      save(); renderAjustes();
      break;
    case 'set-tema':
      DATA.config.tema = d.valor;
      save(); aplicarTema(); renderAjustes();
      break;
    case 'guardar-ajustes': guardarAjustesForm(); break;

    case 'exportar-backup': exportarBackup(); break;
    case 'importar-backup': document.getElementById('fileImportBackup').click(); break;
    case 'instalar-app': await instalarApp(); break;

    case 'elegir-rol': _rolElegido = d.rol; renderAuthScreen(); break;
    case 'crear-perfil': await crearPerfil(); break;
    case 'iniciar-sesion': await iniciarSesion(); break;
    case 'pedir-reset-perfil': await pedirResetPerfil(); break;
    case 'cerrar-sesion': cerrarSesion(); break;

    case 'importar-excel-equipo': document.getElementById('fileImportExcelEquipo').click(); break;
    case 'confirmar-importar-equipo': confirmarImportarEquipo(); break;
    case 'eliminar-informe': await eliminarInforme(d.id); break;
    case 'eliminar-trabajador': await eliminarTrabajadorEquipo(d.nombre); break;
    case 'exportar-resumen-equipo': exportarResumenEquipo(); break;

    case 'cerrar-modal': closeModal(); break;
  }
});

document.addEventListener('change', (e) => {
  if(e.target.id === 'buscadorHistorico'){
    UI.historico.busqueda = e.target.value;
    renderHistorico();
  }
  if(e.target.id === 'rangoIniInput'){ UI.historico.rangoIni = e.target.value; renderHistorico(); }
  if(e.target.id === 'rangoFinInput'){ UI.historico.rangoFin = e.target.value; renderHistorico(); }
  if(e.target.dataset && e.target.dataset.action === 'toggle-dia-activo'){
    DATA.config.dias[e.target.dataset.dow].activo = e.target.checked;
    save(); renderAjustes();
  }
  if(e.target.id === 'fileImportBackup' && e.target.files[0]){
    importarBackupSeleccionado(e.target.files[0]);
    e.target.value = '';
  }
  if(e.target.id === 'fileImportExcelEquipo' && e.target.files[0]){
    importarExcelEquipo(e.target.files[0]);
    e.target.value = '';
  }
});

document.getElementById('tabbar').addEventListener('click', (e) => {
  const b = e.target.closest('.tabbar-item');
  if(b) setTab(b.dataset.tab);
});
document.getElementById('themeQuickToggle').addEventListener('click', () => {
  const orden = ['claro','oscuro','auto'];
  const i = orden.indexOf(DATA.config.tema);
  DATA.config.tema = orden[(i+1)%orden.length];
  save(); aplicarTema();
  toast('Tema: ' + DATA.config.tema);
  if(UI.tab === 'ajustes') renderAjustes();
});

/* ----------------------------- Arranque --------------------------------- */
function init(){
  configurarAccesoDirecto();
  // Evita fichajes de entrada duplicados si hay más de uno abierto por datos corruptos:
  // conserva sólo el primero abierto encontrado (no debería ocurrir con el flujo normal).
  const abiertas = DATA.jornadas.filter(j => j.salida == null);
  if(abiertas.length > 1){
    for(let i=1;i<abiertas.length;i++) abiertas[i].salida = abiertas[i].entrada;
    save();
  }
  aplicarTema();
  if(sesionActiva()){
    arrancarAppPrincipal();
  } else {
    document.getElementById('authScreen').classList.remove('hidden');
    renderAuthScreen();
  }
  setInterval(() => {
    if(!sesionActiva()) return;
    tickLive(); tickTrayecto();
    document.getElementById('headerClock').textContent = fmtDateHuman(todayStr()) + ' · ' + fmtTimeHM(Date.now());
  }, 1000);
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
